<p>Zahra ke saath guzre hue waqt mein mujhe uske mukhtalif andaaz dekhne ko milte thay. Kabhi woh apni baatein khul kar batati, kabhi kisi mazaahiya jumlay par hans deti aur kabhi aisa bhi hota ke woh zyada baat nahi karti thi. Main uski khamoshi ko bhi samajhne ki koshish karta, kyun ke main jaanta tha ke har insaan ke din aur uska mood hamesha ek jaisa nahi hota.</p>

<p>Kisi ko pasand karna aur usay waqai samajhna do alag marahil hain. Pasand aane par insaan aksar us shakhs ki achhi baaton par tawajjo deta hai, lekin samajhne ke liye usay waqt dena parta hai. Uski pasand, na-pasand, uska mizaj aur uska baat karne ka andaaz—yeh sab dheere dheere samajh aate hain.</p>

<p>Main chahta tha ke Zahra mere saamne apni baat kehne mein hichkichahat mehsoos na kare. Agar usay koi baat achhi lagti thi, to woh keh sake; agar kisi cheez se pareshani hoti thi, to woh bhi bata sake. Main har baar uski pareshani door kar sakta tha, aisa nahi tha, lekin kam az kam uski baat sunne ki koshish kar sakta tha.</p>

<p>Kabhi kabhi do log ek hi jagah baithe hote hain aur unke darmiyan zyada baat nahi ho rahi hoti, magar phir bhi unhein ek doosray ki mojoodgi achhi lagti hai. Aisi khamoshi tabhi sukoon deti hai jab dono log us mein mutmain hon. Mere liye bhi Zahra ke saath guzre hue kuch lamhon ki khoobsurati unki saadgi mein thi.</p>

<p>Main usay kisi ek andaaz mein band kar ke nahi dekhna chahta tha. Woh kabhi shararti thi, kabhi hansmukh aur kabhi apni soch mein gum. Uske yeh mukhtalif pehlu hi uski shakhsiyat ka hissa thay. Main chahta tha ke main usay sirf us waqt pasand na karun jab woh hans rahi ho, balkay usay samajhne ki koshish bhi karun jab woh khamosh ho.</p>

<p>Rishte mein har baat ka foran jawab milna zaroori nahi. Kabhi kisi ko apne ehsaas samajhne ke liye waqt chahiye hota hai. Kabhi behtareen jawab yeh hota hai ke aap doosray ki baat sun lein aur usay apni marzi se bolne ka mauqa dein.</p>

<p>Yeh sab baatein main waqt ke saath seekh raha tha. Main koi mukammal insaan nahi tha aur na hi har mauqay par mujhe sahi tareeqa maloom hota tha. Magar Zahra ke saath mera waqt mujhe apne rawaiye aur apne ehsaas ko samajhne ka mauqa de raha tha.</p>

<div class="dialogue">Kabhi kisi ko samajhne ke liye uski baatein sunna zaroori hota hai, aur kabhi usay khamosh rehne ki jagah dena.</div>

<p>Aaj jab main un lamhon ko yaad karta hoon, to mujhe samajh aata hai ke mohabbat sirf dil ki khushi ka naam nahi. Is mein sabr, tawajjo aur doosray shakhs ko apni marzi ke saath qabool karne ka hunar bhi shamil hota hai.</p>

{
title: "Waqt Ki Qeemat",
label: "Baab 40 · Jo Us Waqt Samajh Na Aaya",
body: `
<p>Jab insaan apni zindagi ke kisi khushgawar daur mein hota hai, to aksar usay lagta hai ke yeh din isi tarah guzarte rahenge. Kal bhi baat hogi, aglay din bhi koi mulaqat ho sakti hai aur aane wale waqt mein mazeed yaadein banengi. Main bhi us waqt apni kahani ko isi tarah aage barhta hua dekhta tha.</p>

<p>Zahra ke saath guzre hue din mere liye aam dinon jaise nahi thay, lekin main har lamhe ko alvida kehne ke khayal se bhi nahi jeeta tha. Main apni zindagi ke us hissa mein tha jahan hamari guftagu aur mulaqatein jaari thin. Main chahta tha ke hum ek doosray ko aur samjhein aur apne rishte ko waqt dein.</p>

<p>Jab main pehli mulaqat ko yaad karta hoon, to mujhe woh halki bhoori aankhein yaad aati hain. Jab main Snapchat ka aaghaz yaad karta hoon, to pehla paighaam yaad aata hai. Jinnah Park ko sochta hoon, to safed aur siyah libas aur chalees minute wala mazaahiya jumla zehan mein aa jata hai. Aur baarish wale din ko yaad karta hoon, to chai, khirki ke bahar girti boondein aur Zahra ka meri god mein sar rakhna yaad aata hai.</p>

<p>Yeh sab alag alag waqiat thay, magar in sab ko jorne wali ek hi baat thi: hum ne yeh waqt saath guzara tha. Har yaad hamari kahani ke kisi na kisi safhe se judi hui thi.</p>

<p>Us waqt mujhe yeh maloom nahi tha ke mustaqbil mein kya hoga. Main yeh bhi nahi jaanta tha ke zindagi kabhi aise mor par le aati hai jahan insaan ko apni sab se pyari yaadon ko sirf yaad ke taur par sambhalna parta hai. Lekin us waqt main in andeshon mein nahi rehta tha. Main bas apne aaj ko jee raha tha.</p>

<p>Shayad insaan ke liye yahi behtar hai ke woh apne achhe lamhon ko poori tawajjo se jiye, magar saath hi yeh bhi samjhe ke har rishte ko izzat, bharose aur khuli guftagu ki zaroorat hoti hai. Sirf khoobsurat yaadein hi nahi, balkay roz ke faislay aur rawaiye bhi rishte ko banate hain.</p>

<p>Hamari kahani mein abhi bohat kuch baqi tha. Abhi aur mulaqatein honi thin, aur bhi baatein karni thin aur aise lamhay bhi aane thay jin ke baare mein main us waqt soch bhi nahi sakta tha. Main bas yahi chahta tha ke hamare darmiyan apnapan qaim rahe aur hum ek doosray ko samajhne ki koshish jaari rakhein.</p>

<div class="dialogue">Us waqt humein nahi pata hota ke kaun sa mamooli din kal hamari sab se qeemti yaad ban jayega.</div>

<p>Yeh baab unhi dinon ke naam hai—un dinon ke jab kahani chal rahi thi, mulaqatein ho rahi thin aur hum apni zindagi ke safhon par ek doosray ka naam likh rahe thay.</p>
`

<p>Us waqt mujhe lagta tha ke hamare paas aage bhi bohat sa waqt hai. Abhi aur mulaqatein honi hain, aur baatein karni hain aur bohat si yaadein banani hain. Main har din yeh soch kar nahi guzarta tha ke kabhi yeh waqt khatam bhi ho sakta hai. Main bas us rishte ko jee raha tha jo mere liye ahmiyat rakhta tha.</p>

<p>Do saal ke safar mein har din ek jaisa nahi hota. Kuch din bohat khushgawar hote hain, kuch mein thakan ya masroofiyat hoti hai aur kuch mein kisi baat par narazgi bhi aa sakti hai. Hamari kahani mein bhi yeh sab pehlu thay. Magar in sab ke darmiyan hamari yaadein banti rahin aur hum ek doosray ko samajhne ki koshish karte rahe.</p>

{
title: "Mohabbat Sirf Alfaaz Nahi",
label: "Baab 44 · Khayal Rakhna",
body: `
<p>Waqt ke saath main yeh samajhne laga tha ke mohabbat ka izhaar sirf pyare alfaaz keh dene se mukammal nahi hota. Alfaaz apni jagah bohat aham hain, lekin rawaiya bhi utna hi zaroori hota hai. Kisi ki baat tawajjo se sunna, uski sahulat ka khayal rakhna, uski marzi ka ehtram karna aur mushkil waqt mein usay samajhne ki koshish karna bhi rishte ka hissa hai.</p>

<p>Zahra ke saath guzre hue waqt mein aise lamhay bhi thay jin mein main uske liye kuch karna chahta tha. Baarish wale din uske liye chai banana aur usay geelay kapron mein der tak na rehne dena bhi mere liye isi khayal ka hissa tha. Mujhe achha lagta tha ke main uski sahulat ke liye kuch kar sakun.</p>

<p>Kisi ka khayal rakhne ka matlab yeh nahi ke aap uski har pareshani door kar sakte hain. Zindagi mein bohat si cheezein aisi hoti hain jo hamare ikhtiyar mein nahi hotin. Lekin hum apna rawaiya behtar rakh sakte hain, doosray ki baat sun sakte hain aur usay yeh mehsoos kara sakte hain ke uski baat ahmiyat rakhti hai.</p>

<p>Main bhi apne rishte ke dauran yeh sab seekh raha tha. Kabhi mujhe kisi baat ka sahi jawab samajh aa jata aur kabhi baad mein ehsaas hota ke mujhe pehle zyada tawajjo se sunna chahiye tha. Insaan waqt ke saath apne rawaiye ko samajhta hai aur us se seekh sakta hai.</p>

<p>Hamare darmiyan pehli narazgi bhi hui thi. Us waqia ne mujhe yeh samjhaya ke fikr aur apnapan ke bawajood doosray shakhs ki apni marzi ka ehtram zaroori hai. Kisi ko chahna us par apni har baat manwane ka haq nahi deta. Rishte ko mazboot banane ke liye dono taraf ki baat sunna aur samajhna zaroori hota hai.</p>

<p>Yeh baatein main aaj peeche mur kar zyada saaf dekh sakta hoon. Us waqt main bhi apne ehsaas ke saath jee raha tha aur bohat si cheezein seekh raha tha. Har yaad sirf khushi nahi deti; kuch yaadein humein apne aap ko behtar samajhne ka mauqa bhi deti hain.</p>

<p>Mujhe Zahra ke saath guzare hue khoobsurat lamhay yaad hain, magar main yeh bhi samajhta hoon ke kisi rishte ki qeemat sirf uski khoobsurat yaadon se nahi hoti. Us mein ek doosray ko izzat dena, apni ghalti tasleem karna aur ikhtilaf ke bawajood baat cheet ki gunjaish rakhna bhi zaroori hai.</p>

<p>Mohabbat ki kahani tabhi haqeeqi lagti hai jab us mein insaanon ki tarah khushiyan bhi hon, ghaltiyan bhi aur seekhne ke mauqay bhi. Hamari kahani bhi aisi hi thi. Hum apne waqt ke saath badal rahe thay aur ek doosray ko samajhne ki koshish kar rahe thay.</p>

<div class="dialogue">Kisi ka khayal rakhna sirf uske paas hone ka naam nahi; uski baat, uski marzi aur uske ehsaas ko jagah dena bhi hai.</div>

<p>Yeh safha hamare us daur ki yaad hai jab hamara rishta apne rozmarrah ke lamhon mein aage barh raha tha. Humein nahi pata tha ke mustaqbil mein kya hoga, magar hamare guzre hue din apni jagah ek poori kahani banate ja rahe thay.</p>
`
}

<p>Kuch naam sirf kisi ko bulane ke liye nahi hote. Kuch naam aise hote hain jin ke saath ek poora andaaz, ek khaas lehja aur bohat si yaadein judi hoti hain. Mere liye Zahra ka naam bhi aisa hi tha. Lekin jab main usay apne banaye hue nicknames se bulata tha, to us naam ke saath ek alag hi apnapan mehsoos hota tha. Woh sirf Zahra nahi rehti thi; woh meri Mah Girlee, meri Tamatar Girlee aur meri chhoti si Guriya ban jaati thi.</p>

<p>Mujhe yaad hai ke usay alag alag naam dene ka apna hi maza tha. Kabhi main usay Meri Mah Tamatarrr kehta, kabhi Meri Golu Molu Tamatar aur kabhi Meri Nanhi Si Pari. Kabhi Meri Cutieee Si Baby aur kabhi Meri Jaan-e-Tamannaa. In naamon ka koi ek hi andaaz nahi tha. Kabhi mazaaq hota, kabhi pyar se bulana hota aur kabhi bas dil chahta ke usay aise pukarun ke usay samajh aa jaye ke woh mere liye kitni khaas hai.</p>

<p>Jab main usay Meri Tamatar Girlee kehta, to us naam mein hamara apna mazaaq bhi shamil hota. Aur jab Meri Choti Si Guriya kehta, to lehja khud ba khud narm ho jata. Har nickname ka apna rang tha. Kuch naam sun kar hansne ka dil karta aur kuch naam sirf apnapan mehsoos karwate thay.</p>

<p>Zahra ke liye mere diye hue naam bhi aise hi thay. Main chahta tha ke jab main usay un mein se kisi naam se bulaun, to woh usi apne andaaz mein jawab de. Kabhi mazaaq ke saath, kabhi sharmili si muskurahat ke saath aur kabhi bas apni baat jaari rakh kar. Har baar koi bara waqia hona zaroori nahi tha. Kabhi sirf uska naam sun kar khush ho jana hi kaafi tha.</p>

<div class="dialogue">“Meri Mah Girlee.”</div>

<p>Yeh sirf teen lafz thay, magar in ke saath kitni baatein judi hui thin. Kabhi yeh naam mazaaq mein aata, kabhi kisi pyari si guftagu mein aur kabhi bas yun hi, jab dil chahta ke usay usi khaas andaaz mein bulaun jo hamara apna tha.</p>

<p>Har rishte ki apni ek chhoti si zubaan hoti hai. Kuch baatein aam alfaaz mein hoti hain aur kuch aise naamon mein jo waqt ke saath sirf do logon ke darmiyan maani rakhne lagte hain. Hamare liye bhi yeh nicknames usi zubaan ka hissa thay. Aur shayad isi liye aaj unhein yaad karna sirf naam yaad karna nahi, balkay us daur ko yaad karna hai jab hamari kahani apni raftaar se chal rahi thi.</p>

<p>Lekin zindagi mein kuch cheezein waqt guzarne ke baad apni asal qeemat samjhati hain. Jo lafz kabhi rozmarrah ka hissa hota hai, woh baad mein kisi poore daur ka darwaza ban sakta hai. Ek nickname sunte hi zehan mein kisi ki muskurahat, uska baat karne ka andaaz aur woh waqt aa sakta hai jab aap dono ek doosray ki zindagi mein thay.</p>

<p>Isi liye meri kahani mein Zahra ke naam aur uske nicknames ka apna baab hai. Kyun ke kabhi kabhi mohabbat ki sab se chhoti nishani bhi sab se gehri yaad ban jaati hai.</p>

{
title: "Baarish Wala Din",
label: "Baab 46 · Ek Yaad Jo Thehar Gayi",
body: `
<p>Har rishte mein kuch din aise hote hain jo kisi khaas plan ki wajah se nahi, balkay achanak hone wale waqiat ki wajah se yaad reh jaate hain. Hamare liye baarish wala din bhi aisa hi tha. Main Zahra se milne gaya tha. Mujhe nahi pata tha ke us din mausam hamari mulaqat ko ek aisa rang de dega jo baad mein yaad karne par bhi zehan mein taaza ho jayega.</p>

<p>Din apne mamool ke mutabiq chal raha tha, magar phir baarish shuru ho gayi. Pehle shayad hum ne socha ho ke thori dair mein ruk jayegi, lekin mausam ne humein geela kar diya. Kapron par baarish ke qatre thay aur mahaul mein woh thandak thi jo baarish ke baad hawa mein mehsoos hoti hai. Aise waqt mein insaan aksar pehle apni sahulat ka sochta hai: geelay kapray, thand aur ab aage kya karna hai.</p>

<p>Main Zahra ko is tarah baarish mein pareshan nahi dekhna chahta tha. Is liye main usay apne ghar le aaya, taake woh aaraam kar sake aur geelay kapron mein na baithi rahe. Ghar aa kar maine apni behan ke kapray usay diye, taake woh kapray badal kar sukoon se baith sake. Yeh mere liye koi bara kaam nahi tha. Us waqt mere zehan mein bas itni si baat thi ke woh aaraam mein ho aur usay mushkil na ho.</p>

<p>Baarish ke baad ghar ka mahaul bhi alag lagta hai. Baahar pani gir raha ho, hawa mein thandak ho aur andar rozmarrah ki zindagi apne mamool ke mutabiq chal rahi ho, to ek saadah sa kamra bhi yaadgaar ban sakta hai. Us din bhi hamare paas koi bohat bara program nahi tha. Bas ek achanak badal jane wala din tha aur us ke darmiyan hum dono apni jagah bana kar baithe thay.</p>

<p>Maine chai banayi. Chai banane ka amal apni jagah saada tha: kitchen mein jana, cheezein jama karna, chai tayyar karna aur phir cup le aana. Lekin jab aap kisi khaas shakhs ke liye koi chhoti si cheez karte hain, to woh mamooli kaam bhi yaad ka hissa ban sakta hai. Mere liye us din chai banana bhi aisa hi tha.</p>

<p>Chai ke saath kuch khana bhi tayyar kiya. Baarish ke din garam chai ka apna hi maza hota hai. Baahar mausam geela aur thanda, andar garam chai aur saamne woh shakhs jiske saath aap waqt guzarna chahte hain. Kabhi kabhi khushi ke liye kisi mehngi jagah ya kisi khaas intezam ki zaroorat nahi hoti. Aik saada sa lamha bhi dil mein jagah bana sakta hai.</p>

<p>Hum ne apna waqt saath guzara. Baat cheet hoti rahi aur baarish wala waqia hamari mulaqat ka hissa ban gaya. Mujhe us din ki yaad mein sirf geelay kapray ya chai ka cup nahi dikhta; mujhe woh poora mahaul yaad aata hai. Achanak mausam badal jana, ghar tak aana, kapron ka intezam karna aur phir aaraam se baith kar waqt guzarna.</p>

<p>Us waqt shayad mujhe yeh andaza nahi tha ke ek saada sa din bhi kitna yaad reh sakta hai. Main usay kisi novel ka khaas scene banane ke liye nahi jee raha tha. Main bas apni zindagi ka ek din guzar raha tha. Lekin jab insaan peeche mur kar dekhta hai, to usay samajh aata hai ke yaadein aksar us waqt banti hain jab hum unhein yaadgar banane ki koshish bhi nahi kar rahe hote.</p>

<div class="dialogue">Kuch din plan karke yaadgar nahi banaye jaate. Woh bas guzar jaate hain, aur phir saalon baad dil unhein dobara jeena chahta hai.</div>

<p>Baarish ka woh din hamari kahani ka aisa hi ek safha tha. Us mein koi zaroori nahi ke duniya badal dene wali baat hui ho. Uski ahmiyat is mein thi ke woh hamara din tha, hamari mulaqat thi aur hamari yaadon ka ek aisa hissa ban gaya jo baad mein bhi mere saath raha.</p>

<p>Aaj jab main us din ko yaad karta hoon, to mujhe lagta hai ke kabhi kabhi zindagi apni sab se khoobsurat yaadein bilkul saadah tareeqon se bana deti hai. Baarish shuru hoti hai, chai banti hai, do log baith kar baatein karte hain aur waqt apni raftaar se aage nikal jata hai. Magar yaad wahin kahin thehar jaati hai.</p>
`

<p>Kisi rishte mein qurbat ka matlab hamesha bohat se alfaaz kehna nahi hota. Kabhi kabhi insaan kisi apne ke paas khamoshi se baith kar bhi sukoon mehsoos karta hai. Na kisi khaas topic ki zaroorat hoti hai, na har waqt hansne ki aur na hi har khamoshi ko baat se bharne ki. Bas itna kaafi hota hai ke saamne wala aapki mojoodgi mein aaraam mehsoos kare.</p>

<p>Zahra ke saath guzre hue lamhon mein aise saadah pal bhi thay. Kabhi woh thak kar meri god mein sar rakh leti aur main uske baalon mein ahista ahista haath pherta. Mere liye us waqt sab se zaroori baat yeh hoti ke woh aaraam se ho. Agar woh baat karna chahti, to main uski baat sunta; agar woh khamosh rehna chahti, to main uski khamoshi ko bhi jagah deta.</p>

<p>Us lamhay ki khoobsurti kisi filmi dialogue mein nahi thi. Woh ek saadah si qurbat thi. Kisi ka aapke paas itminan se baithna, apni thakan ko kuch dair ke liye bhool jana aur aapka uski sahulat ka khayal rakhna. Kabhi kabhi aise hi lamhon mein insaan ko ehsaas hota hai ke rishte ka sukoon kitna aham hai.</p>

<p>Main uske baalon mein haath pherta rehta aur waqt dheere dheere guzarta. Har lamhay mein kuch kehna zaroori nahi tha. Kabhi main us se koi chhoti si baat pooch leta aur kabhi hum dono khamosh rehte. Agar woh aaraam karna chahti, to main koshish karta ke usay be-wajah pareshan na karun. Uski sahulat aur marzi ka khayal rakhna us lamhay ka sab se aham hissa tha.</p>

<p>Jab koi shakhs aapke saath itminan mehsoos karta hai, to us ehsaas ki qeemat hoti hai. Lekin us qeemat ko samajhne ka matlab yeh nahi ke hum us shakhs ko apni milkiyat samajhne lagen. Kisi ki qurbat ek bharosa hoti hai aur bharose ka jawab narmi, ehtram aur zimmedari se diya jata hai.</p>

<p>Us waqt main shayad in sab baaton ko itne saaf alfaaz mein bayan nahi kar sakta tha. Main bas us lamhay mein hota tha. Zahra mere paas hoti, hum apna waqt saath guzarte aur main chahta ke woh sukoon mehsoos kare. Aaj jab main us yaad ko alfaaz deta hoon, to samajh aata hai ke saadah lamhon mein bhi bohat se maani chhupe hote hain.</p>

<p>Log aksar mohabbat ko bade waqiat se jorte hain: pehli mulaqat, pehla izhaar, koi khaas tohfa ya koi yaadgar din. Lekin mere liye hamari kahani mein aise khamosh lamhon ki bhi apni jagah hai. Un mein na koi bara waada tha aur na mustaqbil ke baare mein koi lambi guftagu. Bas ek doosray ke paas baith kar waqt guzarna tha.</p>

<div class="dialogue">Kabhi kabhi sukoon ka matlab sirf itna hota hai ke insaan ko kuch dair ke liye apni khamoshi samjhane ki zaroorat na pade.</div>

<p>Yeh yaad mujhe is liye bhi khaas lagti hai ke is mein koi banawat nahi thi. Woh hamare waqt ka ek saada sa hissa tha. Main usey aaj kisi kahani mein likh raha hoon, magar jab woh lamha guzra tha, tab main bas apni zindagi jee raha tha.</p>

<p>Ab samajh aata hai ke yaadein sirf un cheezon ki nahi banti jinhein hum duniya ko dikha sakte hain. Kuch yaadein bohat zaati hoti hain. Unka asal matlab sirf woh shakhs samajh sakta hai jis ne unhein mehsoos kiya ho. Mere liye Zahra ke saath guzre hue yeh khamosh lamhay bhi isi qisam ki yaadein hain.</p>

{
title: "Jab Sab Kuch Mamool Lagta Tha",
label: "Baab 48 · Kal Ka Bharosa",
body: `
<p>Rishte ke darmiyan ek waqt aisa bhi aata hai jab bohat si cheezein mamool ka hissa ban jaati hain. Aap kisi se baat karne ke aadhi ho jaate hain, mulaqat ka khayal aapko ajnabi nahi lagta aur us shakhs ka naam aapke din ka pehchana hua hissa ban jata hai. Aapko lagta hai ke yeh silsila isi tarah chalta rahega.</p>

<p>Mere liye bhi Zahra ke saath guzarte hue waqt mein aisa ehsaas tha. Hamari kahani mein bohat se marahil aa chuke thay. Pehli mulaqat ka tajassus, uska naam maloom karna, pehla paighaam, phir izhaar aur uska haan kehna. Jinnah Park ki pehli mulaqat aur uske baad saath guzare hue din. In sab ke baad hamare paas apni yaadon ka ek lamba silsila tha.</p>

<p>Jab koi rishta aage barhta hai, to insaan dheere dheere us mein apni jagah samajhne lagta hai. Aapko doosray shakhs ke baat karne ka andaaz maloom hone lagta hai, uski pasand aur na-pasand ka andaza hota hai aur aap seekhte hain ke kis mauqay par baat karni hai aur kis waqt sirf sunna hai. Yeh sab ek din mein nahi hota. Is ke liye waqt aur tawajjo chahiye hoti hai.</p>

<p>Hamare darmiyan bhi samajhne ka yeh safar jaari tha. Har baat par hamara nazariya ek jaisa ho, yeh zaroori nahi tha. Kabhi kisi baat par ikhtilaf ho sakta tha, kabhi kisi ka mood badal sakta tha aur kabhi din bhar ki masroofiyat ki wajah se guftagu ka andaaz bhi badal jata tha. Lekin ek rishte ko samajhne ka matlab yahi hai ke insaan har din ko ek hi paimane se na naapay.</p>

<p>Main us waqt mustaqbil ke baare mein bohat se khayalat rakhta tha. Jab hum kisi ko apni zindagi mein ahmiyat dete hain, to dil chahta hai ke aane wale din bhi usi tarah guzrein. Aap sochte hain ke aage aur mulaqatein hongi, aur yaadein banengi aur jo rishta aaj hai woh kal bhi qaim rahega.</p>

<p>Magar mustaqbil ka ilm kisi ke paas nahi hota. Insaan apni taraf se koshish karta hai, apne faislay karta hai aur umeed rakhta hai. Phir bhi kuch halaat aise hote hain jo uske ikhtiyar se baahar hote hain. Us waqt mujhe yeh baat utni gehrai se mehsoos nahi hoti thi. Main hamare saath guzarte hue waqt mein masroof tha aur mere liye aane wale din abhi khulay hue safhay thay.</p>

<p>Aaj peeche mur kar dekhun to samajh aata hai ke mamool ki qeemat aksar us waqt samajh aati hai jab mamool badal chuka hota hai. Roz ki guftagu, mulaqat ka intezar aur kisi ke saath chhoti chhoti baatein share karna us waqt bilkul fitri lagta hai. Insaan har roz nahi sochta ke yeh lamhay ek din sirf yaadon ki shakal mein bhi reh sakte hain.</p>

<p>Lekin is ka matlab yeh nahi ke humein har khushi ke darmiyan judaai ka khauf rakhna chahiye. Guzarte hue achhe waqt ko achhe waqt ki tarah jeena bhi zaroori hai. Har yaad ko uske khatam hone ke darr se dekhna insaan ko us lamhay ki khushi se door kar deta hai.</p>

<div class="dialogue">Us waqt mujhe lagta tha ke hamare paas bohat sa kal hai. Main nahi jaanta tha ke zindagi ke kuch faislay hamari soch se bilkul mukhtalif bhi ho sakte hain.</div>

<p>Hamari kahani abhi apne safar mein thi. Khushiyan thin, apnapan tha, kuch ikhtilaf bhi thay aur aage ke liye umeedein bhi. Main nahi jaanta tha ke aane wale waqt mein humein kitne mushkil faislon ka saamna karna padega. Filhaal mere liye Zahra meri zindagi ka woh hissa thi jiske saath main apne din share kar raha tha.</p>

<p>Aur shayad isi liye un dinon ko yaad karte hue main sirf unke anjaam ko nahi dekhta. Main unhein unki apni qeemat ke saath yaad karna chahta hoon. Woh waqt apni jagah haqeeqi tha, uski khushiyan apni jagah sach thin aur us daur mein hamare paas jo umeedein thin, woh bhi hamari kahani ka hissa thin.</p>
`

{
title: "Waqt Ke Saath Badalta Hua Rishta",
label: "Baab 49 · Do Saal Ki Dastaan",
body: `
<p>Do saal ka safar jab shuru hua tha, tab mere paas sirf kuch umeedein thin. Mujhe nahi pata tha ke hamari kahani mein kitni khushiyan aayengi, kitni baatein yaad banengi aur kitne aise lamhay honge jinhein main baad mein baar baar yaad karunga. Main ne to bas ek larki ko dekha tha, uski halki bhoori aankhon mein dilchaspi mehsoos ki thi aur phir dheere dheere usay jaanne ki khwahish mere andar barhti gayi thi.</p>

<p>Us waqt mujhe kahan pata tha ke jis larki ko main Eid ki shopping ke darmiyan pehli baar dekh raha hoon, ek din uska naam meri roz ki guftagu ka hissa ban jayega. Mujhe kahan maloom tha ke main apni behan se uske baare mein poochunga, uska naam jaanne ki koshish karunga aur phir Snapchat par usay pehla paighaam bhejunga. Yeh sab us waqt chhote chhote qadam thay, lekin inhi qadmon ne mil kar hamari kahani ka pehla safha banaya.</p>

<p>Phir woh hafta aaya jab main ne apne dil ki baat keh di. Zahra ka haan kehna mere liye ek aisa lamha tha jis ki khushi ko alfaaz mein samjhana mushkil hai. Main ne pehle bhi khushiyan dekhi hongi, lekin kisi ke liye apne dil mein khaas jagah banne aur phir us taraf se qabooliyat milne ka ehsaas mere liye naya tha. Us ek jawab ne mere liye hamare rishte ko ek naya maani de diya.</p>

<p>Uske baad hamare darmiyan baat cheet ka andaaz badalta gaya. Hum ek doosray ki pasand aur na-pasand jaante gaye. Kabhi kisi baat par hans dete, kabhi kisi baat ko samajhne mein waqt lagta aur kabhi ek doosray ko samjhane ke liye zyada baat karni padti. Yeh sab kisi ek din mein nahi hua. Rishta waqt ke saath aage barhta raha aur hum apni apni jagah ek doosray ko samajhna seekhte rahe.</p>

<p>Mujhe Zahra ka baat karne ka andaaz pasand tha. Uski guftagu mein woh apnapan tha jo mujhe us se aur baat karne par amada karta. Main usay sunna chahta tha, uski baaton ko samajhna chahta tha aur chahta tha ke woh bhi mere saath apni baatein share kar sake. Uski mojoodgi dheere dheere mere din ka pehchana hua hissa ban gayi.</p>

<p>Phir terah August do hazaar chaubees ka din aaya. Jinnah Park mein hamari pehli mulaqat apni jagah ek khaas yaad ban gayi. Zahra siyah libas mein thi aur main safed libas mein. Hum baatein karte rahe aur waqt ka andaza hi nahi raha. Chalees minute tak main uski baatein sunta raha. Jab jaane ka waqt qareeb aaya, to usne achanak kaha, “Oh, maaf kijiyega, main aapse poochna hi bhool gayi, aapki umar kya hai?” Main muskura kar bola, “40 minutes.”</p>

<p>Woh chhota sa mazaahiya lamha aaj bhi us mulaqat ko yaad karne ka apna andaaz deta hai. Kabhi kabhi kisi yaad ki khoobsurati uske bade hone mein nahi hoti, balkay us chhoti si baat mein hoti hai jo usay doosri yaadon se alag kar deti hai. Jinnah Park ka woh din bhi hamari kahani mein aisa hi ek safha tha.</p>

<p>Us mulaqat ke baad bhi zindagi apni raftaar se chalti rahi. Hum mile, baatein ki, ek doosray ki aadaton ko samjha aur apne rishte mein naye lamhay shamil karte gaye. Baarish wala din bhi aaya, jab mausam ne achanak hamari mulaqat ka rukh badal diya. Hum bheeg gaye, main Zahra ko ghar le aaya, uske liye meri behan ke kapron ka intezam kiya aur chai banayi. Main ne khana bhi tayyar kiya. Us din ki saadgi hi uski yaad ka ek hissa ban gayi.</p>

<p>Is ke bawajood, main yeh nahi keh sakta tha ke sab kuch zaroor hamari marzi ke mutabiq ho jayega. Umeed rakhna ek baat thi aur kisi natije ki guarantee dena doosri. Main Zahra ko jhooti tasalli nahi dena chahta tha. Main chahta tha ke woh jaane ke main apni taraf se rishte ko ahmiyat deta hoon, lekin main yeh bhi samajhta hoon ke uske ghar ke halaat ko ek jumle mein badla nahi ja sakta.</p>

<p>Us waqt hamari purani yaadein aur aane wale waqt ke sawal ek saath mere zehan mein rehte thay. Kabhi pehli mulaqat yaad aati, kabhi Jinnah Park ka woh mazaahiya jumla aur kabhi baarish mein chai banane ka din. Phir zehan wapas usi sawal par aa jata: agar ghar walay razi na hue, to hamare paas kya raasta bachega?</p>

<p>Yeh woh mor tha jahan kahani ka lehja badalne laga. Pehle hum zyada tar apne saath guzare hue waqt ki baatein karte thay. Ab mustaqbil ke baare mein sochna bhi zaroori ho gaya tha. Hamare paas yaadein thin, jazbaat thay aur ek doosray ko samajhne ki khwahish thi. Lekin ab ek aisa faisla saamne tha jise hum sirf apne dil ki marzi se badal nahi sakte thay.</p>

<p>Main us waqt bhi chahta tha ke kahani ka koi behtar raasta nikle. Main chahta tha ke waqt humein samajhne ka mauqa de aur baat itni aage na barhe ke wapsi mushkil ho jaye. Magar mujhe nahi pata tha ke Zahra ke dil mein is sab ke darmiyan kitni pareshani jama ho rahi thi.</p>

<p>Uske baad woh waqt aaya jab Zahra ne apni pareshani mere saamne rakhi. Uski baat mein sirf ek maslay ka zikr nahi tha; us mein ghar ki na-razamandi, apne walid ko samjhane ki mushkil aur hamare mustaqbil ke baare mein be-yaqeeni bhi shamil thi.</p>

<p>Woh guftagu hamari kahani ka ek aisa safha banne wali thi jise yaad karna aasaan nahi tha. Kyun ke is baar baat kisi nickname, kisi mulaqat ya kisi mazaahiya jumlay ki nahi thi. Is baar humein us haqeeqat ka saamna karna tha jise hum dono apni marzi se mukammal taur par badal nahi sakte thay.</p>
`

{
title: "Zahra Ki Aankhon Mein Pareshani",
label: "Baab 54 · Woh Baat Jo Woh Kehna Chahti Thi",
body: `
<p>Kisi apne ki pareshani ko samajhna kabhi kabhi us waqt bhi mushkil hota hai jab woh apni baat keh raha ho. Aap uske alfaaz sunte hain, lekin saath hi yeh bhi sochte hain ke uske dil par kya guzar rahi hogi. Aap chahte hain ke koi aisa jumla mil jaye jo usay tasalli de sake. Magar har dukh ke liye ek aisa jumla nahi hota jo sab kuch theek kar de.</p>

<p>Zahra ne jab mujhe bataya ke uske walid hamare rishte par razi nahi hain, to us baat ki sanjeedgi ko nazarandaz karna mumkin nahi tha. Uske ghar mein cousin ka rishta aaya hua tha aur ab hamare mustaqbil ka sawal sirf hamare darmiyan nahi raha tha. Is mein uske ghar walon ka faisla bhi shamil tha.</p>

<p>Usne apni pareshani ka izhar karte hue kaha ke woh samajh nahi paa rahi ke apne walid ko kaise manaye. Uske liye yeh sirf kisi ko apni pasand batane ka masla nahi tha. Woh apne ghar mein rehti thi, apne walid ke saath uska rishta tha aur unki na-razamandi ka saamna karna uske liye aasaan nahi ho sakta tha.</p>

<div class="dialogue">“Mujhe samajh nahi aa raha ke main Abbu ko kaise samjhaun. Woh hamare rishte par razi nahi hain.”</div>

<p>Yeh alfaaz sun kar mere paas koi jaadu jaisa jawab nahi tha. Main chahta tha ke uski pareshani kam ho, magar main yeh bhi jaanta tha ke uske walid ka faisla mere ek jumle se badal nahi sakta. Main usay yeh keh sakta tha ke hum koshish karenge, baat samajhne ka raasta dhoondhenge aur jaldbaazi mein koi faisla nahi karenge. Lekin main usay aisi guarantee nahi dena chahta tha jise poora karna mere ikhtiyar mein hi na ho.</p>

<p>Kabhi kabhi mohabbat mein sab se mushkil kaam yahi hota hai ke aap apne apne jazbaat ke bawajood haqeeqat ko tasleem karne ki koshish karein. Aap chahte hain ke saamne wala pareshan na ho, lekin uski pareshani ki wajah aap khud bhi door nahi kar sakte. Aap uske saath kharay rehna chahte hain, magar aapko yeh bhi samajhna padta hai ke har qadam soch samajh kar uthana zaroori hai.</p>

<p>Main Zahra ki baat sunna chahta tha. Main nahi chahta tha ke woh apni pareshani ko apne andar hi rakhe. Us waqt usay kisi aise shakhs ki zaroorat ho sakti thi jo uski baat ko beech mein roke baghair sune, uske darr ko mamooli na samjhe aur usay yeh na kahe ke sab kuch aasaan hai jab ke haqeeqat mein sab kuch aasaan nahi tha.</p>

<p>Hamare darmiyan jo do saal guzre thay, un mein bohat se khushgawar lamhay thay. Lekin is guftagu mein un sab yaadon ke bawajood ek naya bojh mehsoos hota tha. Pehle hum apni khushi ke baare mein baat karte thay. Ab humein yeh bhi sochna pad raha tha ke agar ghar walon ki razamandi na mili, to hum apni khwahish aur halaat ke darmiyan kaise faisla karenge.</p>

<p>Mere zehan mein hamari pehli mulaqat ka manzar aata tha. Eid ki shopping mein woh pehli nazar, phir uska naam jaanne ki koshish aur phir pehla paighaam. Main sochta tha ke hamari kahani kitni saadah tareeqe se shuru hui thi. Kisi ko nahi pata tha ke us ek nazar ke baad kitni baatein aur kitni yaadein banengi.</p>

<p>Jinnah Park ka din bhi yaad aata tha. Uska siyah libas, mera safed libas aur woh chalees minute ki baat jis par aaj bhi muskurahat aa sakti thi. Baarish ka din yaad aata tha, chai ka cup yaad aata tha aur uske woh nicknames yaad aate thay jo hamare darmiyan ek chhoti si duniya banate thay.</p>

<p>Lekin yaadein mustaqbil ka faisla nahi kar sakti thin. Woh humein yeh zaroor yaad dila sakti thin ke hamara rishta hamare liye aham tha, magar ghar walon ki na-razamandi ka hal dhoondhne ke liye alag koshish chahiye thi.</p>

<div class="dialogue">Main chahta tha ke usay tasalli doon, lekin main jaanta tha ke tasalli aur maslay ka hal ek hi cheez nahi hote.</div>

<p>Us waqt mujhe yeh samajhna tha ke Zahra ko sirf mere jazbaat ka yaqeen dilana kaafi nahi. Uski apni pareshani bhi haqeeqi thi. Woh apne ghar ke maamlaat ka saamna kar rahi thi aur main uski jagah faisla nahi kar sakta tha. Main uski baat sun sakta tha, apni taraf se koshish karne ka irada rakh sakta tha aur uske saath izzat aur sabr se pesh aa sakta tha.</p>

<p>Hum ne apni taraf se koshish karne ki umeed rakhi. Humein lagta tha ke shayad waqt ke saath baat samajh aa jaye, shayad kisi din halaat behtar ho jayen aur shayad koi aisa raasta mil jaye jo hamare liye mumkin ho. Umeed rakhna us waqt fitri baat thi, kyun ke hum dono ke paas abhi bhi apne guzre hue waqt ki yaadein aur ek doosray se judi khwahishen thin.</p>

<p>Magar us guftagu ke baad ek baat wazeh ho gayi thi: ab hamari kahani ko sirf pyari yaadon ke saharay aage nahi barhna tha. Humein ek haqeeqi maslay ka saamna karna tha. Aur us maslay ka anjaam abhi hamare saamne nahi tha.</p>
`
},

{
title: "Umeed Ko Thamay Rakhna",
label: "Baab 55 · Koshish Ka Waqt",
body: `
<p>Jab koi mushkil saamne aati hai, to insaan ka pehla khayal aksar yahi hota hai ke shayad koi raasta nikal aaye. Woh guzre hue waqt ko yaad karta hai, apni khwahish ko samajhta hai aur phir apni taraf se mumkin koshish karna chahta hai. Hamare liye bhi us waqt umeed ko foran chhor dena aasaan nahi tha.</p>

<p>Hamare paas takreeban do saal ki yaadein thin. Yeh woh waqt tha jis mein hum ne ek doosray ko jaana tha. Pehli guftagu se lekar lambi baaton tak, pehli mulaqat se lekar baad ke dinon tak, hamari kahani mein bohat kuch shamil ho chuka tha. Main in sab ko ek pal mein bhool nahi sakta tha, aur na hi mere liye yeh mumkin tha ke main Zahra ki pareshani ko nazarandaz kar doon.</p>

<p>Hum chahte thay ke ghar walon ko samjhane ka koi raasta nikle. Magar kisi ko samjhana sirf apni baat baar baar dohrane ka naam nahi hota. Doosray shakhs ki soch ko samajhna, uske sawalon ka jawab dena aur uske nazariye ko sunna bhi zaroori hota hai. Kabhi is amal mein waqt lagta hai aur kabhi bohat koshish ke bawajood bhi razamandi nahi milti.</p>

<p>Humein bhi isi haqeeqat ka saamna karna tha. Zahra ke walid hamare rishte par razi nahi thay. Unki na-razamandi hamare liye ek bari rukawat thi. Main chahta tha ke baat ka koi behtar hal nikle, lekin main yeh bhi jaanta tha ke kisi ke faislay ko zabardasti badalna mumkin ya durust raasta nahi hota.</p>

<p>Is daur mein insaan ko apne jazbaat aur apne amal ke darmiyan farq samajhna padta hai. Aap kisi ko bohat chah sakte hain, lekin uski zindagi ke faislon par apna ikhtiyar nahi rakh sakte. Aap apni baat keh sakte hain, apni taraf se koshish kar sakte hain aur izzat ke saath apni umeed saamne rakh sakte hain. Magar aakhri faisla hamesha sirf aapke haath mein nahi hota.</p>

<p>Main chahta tha ke Zahra ko yeh ehsaas rahe ke uski pareshani mere liye aham hai. Main uski baat ko halka nahi samajhna chahta tha. Agar woh udaas thi, to main uski udaasi ko foran khatam karne ka daawa nahi kar sakta tha. Agar woh apne walid ko manane ke baare mein pareshan thi, to main usay yeh keh kar khamosh nahi karna chahta tha ke sab aasaan ho jayega. Main bas chahta tha ke hum haqeeqat ko samajhte hue apni taraf se behtar raasta dhoondhen.</p>

<p>Yeh koshish hamare liye aasaan nahi thi. Umeed aur be-yaqeeni ek saath chal rahi thin. Kabhi lagta ke shayad waqt madad karega, aur kabhi yeh khayal pareshan karta ke agar razamandi na mili to phir kya hoga. Jab kisi rishte ka mustaqbil ghair-wazeh ho jaye, to har faisla pehle se zyada bhaari mehsoos ho sakta hai.</p>

<p>Phir bhi, hamari purani yaadein apni jagah thin. Main unhein kisi ghalat faislay ka saboot nahi samajhta tha, balkay hamare guzre hue waqt ka hissa samajhta tha. Woh khushiyan haqeeqi thin. Woh mulaqatein haqeeqi thin. Woh guftagu aur woh chhoti chhoti baatein bhi haqeeqi thin. Aane wale halaat un yaadon ko mita nahi sakte thay.</p>

<div class="dialogue">Hum ne apni taraf se koshish karni thi, magar humein yeh bhi samajhna tha ke har natija hamare ikhtiyar mein nahi hota.</div>

<p>Yeh woh waqt tha jab umeed rakhna bhi zaroori tha aur haqeeqat ko nazarandaz na karna bhi. Main chahta tha ke hamari kahani ka koi aisa raasta nikle jahan kisi ko apne ghar ke saath rishta todne ya apni baat zabardasti manwane ki zaroorat na pade. Main chahta tha ke baat samajhdaari aur izzat ke saath aage barhe.</p>

<p>Lekin har koshish ka natija waisa nahi hota jaisa insaan chahta hai. Kabhi raaste khul jaate hain aur kabhi insaan ko yeh tasleem karna padta hai ke kuch halaat uski umeed se zyada sakht hain. Hamari kahani abhi us faislay tak nahi pohanchi thi, lekin uska saaya hamare mustaqbil par parne laga tha.</p>

<p>Main us waqt nahi jaanta tha ke aage chal kar humein kitna mushkil faisla karna padega. Mujhe sirf itna maloom tha ke Zahra mere liye aham thi aur main chahta tha ke hamare rishte ko samajhne aur suljhane ka har mumkin, izzat-daar raasta azmaya jaye.</p>

<p>Yeh baab usi koshish ki yaad hai: ek aisi koshish jis mein umeed bhi thi, fikr bhi aur yeh darr bhi ke kahin halaat hamare jazbaat se zyada taqatwar sabit na ho jayen.</p>
`
}

<p>Mujhe Zahra ki pareshani ka ehsaas tha. Main nahi chahta tha ke woh apne ghar mein kisi mushkil ka saamna karte hue khud ko bilkul tanha mehsoos kare. Lekin main yeh bhi jaanta tha ke sirf mere uske saath hone ki khwahish se uske ghar ke halaat foran nahi badal sakte thay.</p>

<p>Main apne aap ko yaad dilata ke hamari kahani mein sirf aaj ki pareshani nahi thi. Is mein woh tamam din bhi thay jab hum khush thay, jab hum hansay thay aur jab ek doosray ki baaton mein sukoon dhoond lete thay. Main nahi chahta tha ke aane wale halaat ki fikr hamare guzre hue waqt ki qeemat ko kam kar de.</p>

<p>Lekin dil ko samjhana aur haqeeqat ko badalna do mukhtalif cheezein hain. Main apni yaadon ko sambhal sakta tha, apni taraf se behtar koshish ka irada rakh sakta tha, magar main yeh tay nahi kar sakta tha ke doosray log hamare rishte ko qabool karenge ya nahi.</p>

{
title: "Woh Aakhri Guftagu",
label: "Baab 57 · Jab Alfaaz Kam Parne Lage",
body: `
<p>Har rishte mein kuch guftaguen aisi hoti hain jin ke dauran insaan chahta hai ke waqt thora ruk jaye. Woh chahta hai ke baat ka koi behtar jawab mil jaye, koi naya raasta nazar aa jaye ya saamne wala koi aisi baat keh de jis se dil ka bojh halka ho. Lekin kuch guftaguen aisi bhi hoti hain jin mein dono taraf ke alfaaz khatam hone lagte hain, kyun ke masla alfaaz se zyada gehra hota hai.</p>

<p>Zahra aur mere darmiyan bhi ek aisa waqt aaya jab ghar walon ki na-razamandi aur mustaqbil ki be-yaqeeni hamari baaton ka markaz ban gayi. Uske walid hamare rishte ko qabool nahi kar rahe thay. Zahra ne mujhe bataya tha ke woh samajh nahi paa rahi ke unhein kaise manaye. Main uski baat sunta tha aur chahta tha ke uski pareshani ka koi hal mil jaye.</p>

<p>Main chahta tha ke hum apni taraf se koshish karte rahen, magar main yeh bhi nahi chahta tha ke Zahra apne ghar mein kisi aisi surat-e-haal mein phans jaye jahan uske liye har taraf mushkil ho. Main uski mohabbat ki qadar karta tha, lekin uske jazbaat ke saath uski apni zindagi aur ghar ke halaat ka ehtram bhi zaroori tha.</p>

<p>Jab do log ek doosray se mohabbat karte hain, to unke liye ek doosray ko chhorne ka khayal bhi aasaan nahi hota. Woh guzre hue lamhon ko yaad karte hain aur sochte hain ke kya koi aur koshish baqi hai. Kya kisi aur tareeqe se baat ki ja sakti hai? Kya waqt kuch badal sakta hai? Kya aaj jo namumkin lag raha hai, kal uske liye koi gunjaish nikal aayegi?</p>

<p>Mere zehan mein bhi aise sawal thay. Main nahi chahta tha ke hamari kahani ka faisla itni majboori ke saaye mein ho. Main chahta tha ke hum ek doosray ki baat samajh saken aur jo bhi faisla ho, woh sirf pareshani ke ek lamhe mein na kiya jaye.</p>

<p>Lekin kabhi kabhi insaan jitna bhi soch le, usay aise halaat ka saamna karna padta hai jahan uske paas mukammal jawab nahi hota. Hum apni taraf se chah sakte hain, koshish kar sakte hain aur umeed rakh sakte hain. Magar doosron ki razamandi ko apni marzi se hasil nahi kar sakte.</p>

<p>Is sab ke darmiyan mujhe hamari pehli mulaqat yaad aati thi. Woh din jab mujhe andaza bhi nahi tha ke ek anjaan si larki meri zindagi ki itni aham yaad ban jayegi. Phir uska naam maloom karna, Snapchat par paighaam bhejna, uska jawab aana aur phir hamari baaton ka silsila shuru hona — sab kuch mere zehan mein ek ke baad ek ubhar aata tha.</p>

<p>Mujhe woh pehla hafta yaad tha jab main ne apne dil ki baat kehne ka faisla kiya tha. Mujhe uska haan kehna yaad tha. Woh waqt jab main ne mehsoos kiya tha ke meri zindagi mein ek naya rishta shuru hua hai. Main us waqt nahi jaanta tha ke do saal ke qareeb ka safar aakhir mujhe itni mushkil yaadon tak le aayega.</p>

<p>Phir Jinnah Park ka din yaad aata. Woh siyah aur safed libas, lambi guftagu aur umar wala mazaaq. Main sochta tha ke kitni chhoti si baat bhi kisi rishte mein itni khaas ban sakti hai. Kisi aur ke liye woh sirf ek aam jumla hota, lekin mere liye woh hamari pehli mulaqat ke baad ki sab se pyari yaadon mein se ek tha.</p>

<p>Mujhe baarish wala din bhi yaad aata. Baarish mein bheegna, usay ghar le jana, uske liye kapron ka intizam karna aur phir chai aur khane ke saath ek saadah si shaam guzarna. Woh waqt kisi bari daawat ya mehngi jagah ki wajah se khaas nahi tha. Woh is liye yaadgar tha kyun ke us din hum ne ek saadah lamhe mein bhi apnapan mehsoos kiya tha.</p>

<p>Uski hansi, uski baatein aur uske nicknames par sharmana — yeh sab yaadein mere zehan mein mehfooz thin. Main ne kabhi nahi socha tha ke ek waqt aisa bhi aayega jab inhi yaadon ko yaad karna mere liye sukoon aur dard dono ka sabab banega.</p>

<p>Woh guftagu mere liye is liye mushkil thi kyun ke main Zahra ko sirf apne aaj ka hissa nahi samajhta tha. Main usay apne aane wale waqt ke tasavvur mein bhi shamil kar chuka tha. Lekin ab mujhe samajhna pad raha tha ke mustaqbil ke tasavvur aur haqeeqat ke darmiyan kabhi kabhi bohat bara faasla aa jata hai.</p>

<div class="dialogue">Main chahta tha ke hamare liye koi raasta nikle. Main chahta tha ke hum apni taraf se koshish karne ke baad bhi ek doosray ko samajh saken. Magar mere chahne se har faisla badal nahi sakta tha.</div>

<p>Us waqt main Zahra se koi aisa wada nahi karna chahta tha jiska poora hona mere ikhtiyar mein na ho. Main bas yeh chahta tha ke hamare darmiyan jo kuch tha, usay izzat ke saath yaad rakha jaye. Chahe halaat hamari marzi ke mutabiq na hon, magar hamare guzre hue waqt ki ahmiyat kam nahi honi chahiye thi.</p>

<p>Yeh kehna aasaan hai ke insaan ko haqeeqat qabool kar leni chahiye. Lekin jab haqeeqat aapke dil ki khwahish ke bilkul ulat ho, to usay samajhne mein waqt lagta hai. Main bhi isi kashmakash mein tha. Ek taraf dil kehta tha ke shayad abhi koi raasta baqi hai, aur doosri taraf halaat humein yaad dila rahe thay ke har raasta hamare liye khula nahi hota.</p>

<p>Hamari aakhri mulaqat ka waqt qareeb aa raha tha, lekin us waqt mujhe nahi maloom tha ke woh yaad meri zindagi mein kis tarah reh jayegi. Mujhe nahi pata tha ke uske alfaaz itne arsay tak mere zehan mein goonjte rahenge. Main sirf yeh jaanta tha ke hamare darmiyan jo waqt guzra tha, woh mere liye aam waqt nahi tha.</p>
`
},

{
title: "Main Tumhein Kabhi Nahi Bhoolungi",
label: "Baab 58 · Aakhri Mulaqat",
body: `
<p>Aakhri mulaqat ka zikr karte hue mere liye sab se mushkil baat yeh hai ke us din ki har tafseel ko alfaaz mein sametna mumkin nahi. Kuch lamhay aise hote hain jo insaan ko sirf yaad nahi rehte, balkay uske andar kahin thehar jaate hain. Waqt aage barhta rehta hai, zindagi apni raftaar se chalti rehti hai, magar woh lamha zehan mein apni jagah banaye rakhta hai.</p>

<p>Hamari mulaqat ke us mor par bohat si baatein pehle hi badal chuki thin. Ghar walon ki na-razamandi hamare saamne thi. Zahra apne walid ko samjhane ke baare mein pareshan thi aur main chahta tha ke koi aisa raasta mil jaye jo hamare liye mumkin ho. Hum ne koshish ki, umeed rakhi aur apne rishte ko samajhne ki koshish karte rahe, magar halaat hamari marzi ke mutabiq nahi badal rahe thay.</p>

<p>Jab main us din ko yaad karta hoon, to mere zehan mein sab se pehle Zahra ka chehra aata hai. Woh larki jise main ne Eid ki shopping mein pehli baar dekha tha. Woh jiski halki bhoori aankhon ne meri tawajju apni taraf kheench li thi. Woh jiski baaton ko sunna mujhe pasand tha. Woh jo kabhi meri Mah Girlee ban jaati thi aur kabhi meri Tamatar Girlee.</p>

<p>Uske saath guzre hue waqt ki wajah se woh mere liye sirf ek shakhs nahi rahi thi. Uski aadatein, uski baatein aur uske saath judi hui chhoti chhoti yaadein meri rozmarrah zindagi ka hissa ban chuki thin. Isi liye us din ki udaasi ko samajhna bhi mushkil tha. Main jaanta tha ke hamare liye halaat aasaan nahi rahe, lekin dil ke liye kisi apne se juda hone ke khayal ko qabool karna alag baat hoti hai.</p>

<p>Zahra ro rahi thi. Usay is tarah udaas dekhna mere liye aasaan nahi tha. Jis shakhs ki hansi aapki roz ki khushi ka hissa ban jaye, uski aankhon mein aansu dekh kar aapka dil bhi bojhal ho jata hai. Main chahta tha ke usay tasalli de sakoon, lekin mujhe pata tha ke main uske saamne maujood har mushkil ko khatam nahi kar sakta.</p>

<p>Woh mere paas thi aur us lamhe mein hamare darmiyan guzra hua poora safar jaise yaad ban kar saamne aa gaya tha. Pehla paighaam, pehli haan, Jinnah Park ki mulaqat, chalees minute wala mazaaq, baarish aur chai, aur woh tamam din jab hum ek doosray se apni baatein share karte thay.</p>

<p>Us waqt koi bhi yaad apni jagah chhoti nahi lagti thi. Jo baatein kabhi mamooli lagti thin, woh bhi aham mehsoos ho rahi thin. Woh nicknames jin par Zahra sharma jaati thi, woh lamhay jab woh khamosh ho kar meri baat sunti thi aur woh waqt jab hum ek doosray ki aadaton se waqif ho chuke thay — sab kuch dil mein ek saath ubhar raha tha.</p>

<p>Zahra ne rote hue kaha:</p>

<div class="dialogue">“Main tumhein kabhi nahi bhoolungi.”</div>

<p>Yeh alfaaz mere liye sirf ek jumla nahi thay. In mein us waqt ki udaasi bhi thi aur hamare guzre hue waqt ki yaad bhi. Main uske alfaaz ko aaj bhi yaad karta hoon, kyun ke kuch jumlay apne kehne ke waqt se aage nikal kar insaan ki yaadon mein reh jaate hain.</p>

<p>Main nahi jaanta tha ke us lamhe mein uske zehan mein kitni baatein chal rahi thin. Main uske dil ka har ehsaas apni taraf se bayan nahi kar sakta. Main sirf itna jaanta tha ke woh ro rahi thi, main bhi is judai ke khayal se pareshan tha aur hamare saamne woh halaat thay jinhein badalna hamare liye aasaan nahi raha tha.</p>

<p>Us waqt main chahta tha ke usay yeh mehsoos ho ke hamara guzra hua waqt mere liye bhi aham tha. Main uski yaadon ko kisi shikayat mein badalna nahi chahta tha. Main nahi chahta tha ke hamare aakhri lamhay sirf ilzaam ya gusse ke saath yaad kiye jayen. Halaat ne humein ek mushkil mor par la khara kiya tha, magar hamari kahani mein khushiyan bhi thin aur woh sachay lamhay bhi jinhein main apni yaadon se nikaal nahi sakta tha.</p>

<p>Jab koi apna aapke saamne rota hai, to kabhi kabhi tasalli ke liye alfaaz kam par jaate hain. Aap chahte hain ke uska dukh kam ho, lekin aap yeh bhi jaante hain ke sirf uske saath kharay hone se har masla hal nahi hota. Main bhi us waqt isi ehsaas ke saath tha. Main usay dukh se bachana chahta tha, magar main hamare halaat ko apni marzi se badal nahi sakta tha.</p>

<p>Woh mulaqat mere liye is liye aakhri ban gayi kyun ke uske baad hamare darmiyan rabta nahi raha. Us waqt shayad mere liye yeh samajhna mushkil tha ke ek din aisa bhi hoga jab main usay koi paighaam nahi bhejunga aur uski taraf se koi jawab nahi aayega. Jo guftagu kabhi roz ki aadat thi, woh achanak meri zindagi ka guzra hua hissa ban gayi.</p>

<p>Us din ki yaad mere liye sirf judaai ki yaad nahi. Woh us rishte ki yaad bhi hai jis mein main ne khushi mehsoos ki, kisi ko apna samjha aur apni zindagi ke takreeban do saal uske saath judi hui umeedon ke darmiyan guzare. Uski aankhon mein aansu aur uske alfaaz mere zehan mein reh gaye, lekin un yaadon ke saath woh tamam khushgawar din bhi hain jo hamare darmiyan guzre thay.</p>

<p>Main aaj bhi us din ko yaad karta hoon to sochta hoon ke kaash halaat kuch aur hotay. Kaash hamare paas koi aisa raasta hota jo sab ke liye mumkin hota. Lekin guzra hua waqt wapas nahi aata, aur har “kaash” ka jawab insaan ko nahi milta.</p>

<p>Us mulaqat ke baad hamari kahani ka woh hissa shuru hua jahan baatein nahi thin, paighaam nahi thay aur ek doosray ka haal poochhne ka koi silsila nahi tha. Sirf yaadein thin — aur woh jumla jo Zahra ne rote hue kaha tha: “Main tumhein kabhi nahi bhoolungi.”</p>

<p>Us waqt mujhe nahi pata tha ke us jumlay ko apne saath lekar mujhe kitna lamba safar tay karna hoga.</p>
`
}
,
{
title: "Pehli Raat Uske Baghair",
label: "Baab 59 · Jaise Mujh Se Mera Kuch Juda Ho Gaya",
body: `
<p>Kisi apne se bichharne ke baad pehli raat ajeeb hoti hai. Din bhar insaan kisi na kisi tarah apne aap ko sambhale rakhta hai. Kabhi woh guzri hui baaton ko yaad karta hai, kabhi khud ko samjhata hai ke jo ho gaya, woh ab uske ikhtiyar mein nahi. Kabhi woh apne aap ko doosri cheezon mein masroof karne ki koshish karta hai. Lekin jab raat hoti hai aur aas paas ki awaazein dheemi parne lagti hain, tab dil ko us khamoshi ka ehsaas zyada hota hai jo kisi apne ke chale jaane ke baad reh jaati hai.</p>

<p>Meri zindagi mein bhi woh raat aa gayi thi jab Zahra se juda hone ki haqeeqat mere saamne thi. Woh shakhs jisse main roz baat karne ka aadi ho chuka tha, ab meri roz ki guftagu ka hissa nahi raha tha. Main usay apni baatein nahi bata sakta tha. Main uska haal nahi pooch sakta tha. Main yeh nahi jaan sakta tha ke uska din kaisa guzra, woh khush thi ya pareshan, aur uske zehan mein kya chal raha tha.</p>

<p>Sab se mushkil baat yeh thi ke zindagi bahar se waisi hi nazar aati thi. Ghar wohi tha, kamra wohi tha, cheezein apni jagah par thin aur waqt bhi apni raftaar se guzar raha tha. Lekin mere andar kuch badal gaya tha. Jis shakhs ki maujoodgi meri roz ki zindagi mein shamil thi, uski ghair-maujoodgi ab har us jagah mehsoos hone lagi thi jahan pehle uski yaad khud ba khud aa jati thi.</p>

<p>Main ne apne aap se kaha ke waqt ke saath sab samajh aa jayega. Magar us raat waqt guzarna bhi ajeeb lag raha tha. Ghari ki sui aage barhti thi, lekin zehan baar baar guzre hue dinon mein chala jata tha. Main sochta tha ke kuch arsay pehle tak hum baat karte thay, ek doosray ki baatein sunte thay aur apne din ke chhote chhote waqiat share karte thay. Ab wohi silsila khatam ho chuka tha.</p>

<p>Mujhe uska naam yaad aata tha. Phir uski aankhein. Phir uski hansi. Phir woh tamam nicknames jo main usay bulaya karta tha. Meri Mah Girlee, Meri Tamatar Girlee, Meri Choti Si Guriya. Kabhi kabhi insaan ko baad mein samajh aata hai ke jin baaton ko woh apne din ka mamooli hissa samajhta tha, asal mein wohi uski khushi ka ek bara sabab ban chuki hoti hain.</p>

<p>Jab main usay Meri Tamatar Girlee kehta tha, to mere liye woh sirf ek naam nahi hota tha. Uske saath ek poora andaaz juda tha. Main tasavvur karta ke woh naam sun kar kis tarah sharmaati hogi, kis tarah jawab deti hogi aur kis tarah hamari guftagu kisi chhoti si shararat mein badal jaati hogi. Ab wohi yaadein mere paas thin, lekin unhein kisi naye paighaam ke saath jorne ka mauqa nahi tha.</p>

<p>Us raat mujhe yeh baat samajh aayi ke kisi ki aadat ban jana kitna gehra ehsaas hai. Aadat sirf roz kisi se baat karne ka naam nahi. Aadat yeh bhi hoti hai ke koi baat hoti hai to aap sab se pehle usi ko batane ka sochte hain. Koi mazaahiya waqia hota hai to zehan mein aata hai ke woh sunti to kya kehti. Koi pareshani hoti hai to uski baat yaad aati hai. Khushi milti hai to dil chahta hai ke woh bhi us khushi ka hissa bane.</p>

<p>Jab yeh sab achanak ruk jaye, to insaan ko sirf ek shakhs ki kami nahi mehsoos hoti. Usay apni roz ki zindagi ka woh hissa bhi yaad aata hai jo us shakhs ke saath ban gaya tha.</p>

<div class="dialogue">Jaise mujh se mera kuch juda ho gaya hai.</div>

<p>Yahi woh ehsaas tha jise main alfaaz dene ki koshish karta raha. Aisa nahi tha ke meri zindagi ki har cheez khatam ho gayi thi. Zindagi apni jagah maujood thi, zimmedariyan bhi thin aur aane wale din bhi. Lekin mere andar ek aisi jagah khaali ho gayi thi jahan Zahra ki baatein, uski hansi aur uske saath guzre hue lamhay basa karte thay.</p>

<p>Main ne us raat bohat si purani baatein yaad ki. Hamari pehli guftagu, woh hafta jab main ne apni mohabbat ka izhar kiya tha, aur uska haan kehna. Mujhe yaad aaya ke us waqt main kitna khush tha. Mujhe lagta tha ke ab meri zindagi mein ek aisa shakhs hai jiske saath main apni khushi aur pareshani share kar sakta hoon.</p>

<p>Phir Jinnah Park ka din yaad aaya. Terah August do hazaar chaubees. Zahra ka siyah libas aur mera safed libas. Uska lagataar baatein karna aur mera usay sunte rehna. Jab usne aakhir mein meri umar poochhi thi, to main ne muskura kar kaha tha, “Chalees minute.” Woh chhota sa mazaaq us waqt kitna halka aur khushgawar tha. Mujhe nahi pata tha ke ek din usi mulaqat ko yaad karte hue mere dil mein itni udaasi bhi hogi.</p>

<p>Baarish wala din bhi yaad aaya. Woh baarish, uske liye kapron ka intizam, chai banana aur uske saath waqt guzarna. Mujhe yaad aaya ke kabhi hamari khushi ke liye kisi bari wajah ki zaroorat nahi hoti thi. Ek saadah sa din bhi yaadgar ban jata tha, kyun ke us mein Zahra mere saath hoti thi.</p>

<p>Us raat main guzre hue waqt ko badal nahi sakta tha. Main aane wale dinon ka jawab bhi nahi jaanta tha. Main sirf yaad kar sakta tha aur apne aap ko samjha sakta tha ke jo rishta mere liye aham raha, uski yaadein meri zindagi ka hissa rahengi. Un yaadon ko apni jagah dena aur rozmarrah ki zindagi mein aage barhne ki koshish karna, dono baatein ek saath mumkin thin.</p>

<p>Raat guzarti rahi. Mere zehan mein Zahra ka naam aata raha. Kabhi main uski hansi ko yaad karta, kabhi uske aakhri alfaaz ko. “Main tumhein kabhi nahi bhoolungi.” Usne yeh baat rote hue kahi thi. Main nahi jaanta tha ke aane wale waqt mein uske dil mein kya hoga, lekin main jaanta tha ke main us jumlay ko apni yaadon se aasani se alag nahi kar sakunga.</p>

<p>Subah hui to duniya apne mamool ke mutabiq chal rahi thi. Naya din shuru ho gaya tha. Lekin mere liye woh sirf ek aur din nahi tha. Woh judaai ke baad ka pehla din tha, jahan mujhe apni zindagi ke us hissa ke baghair aage chalna seekhna tha jo takreeban do saal se meri aadat ban chuka tha.</p>

<p>Main ne us din yeh nahi seekha ke kisi ko bhoolna kaise hai. Main ne sirf itna samjha ke kuch yaadein foran khatam nahi hotin. Insaan unhein apne saath lekar zindagi ke aglay din mein qadam rakhta hai. Aur kabhi kabhi sab se mushkil qadam woh hota hai jo insaan khamoshi se uthata hai.</p>
`
},

{
title: "Zahra Ki Aadat",
label: "Baab 60 · Roz Ki Zindagi Mein Uski Kami",
body: `
<p>Log aksar kehte hain ke waqt ke saath insaan ko har cheez ki aadat ho jaati hai. Shayad kuch had tak yeh baat sach hai. Insaan badalte halaat ke saath jeena seekhta hai, apni rozmarrah ki zindagi dobara tarteeb deta hai aur dheere dheere un cheezon ke baghair bhi din guzarna seekh leta hai jo kabhi bohat zaroori mehsoos hoti thin. Lekin kisi ki aadat banne aur uski kami ki aadat hone mein farq hota hai.</p>

<p>Zahra meri aadat ban gayi thi. Main ne yeh baat us waqt bhi mehsoos ki thi jab hum saath thay, lekin uski gehrai mujhe judaai ke baad samajh aayi. Pehle din mein kitni hi baatein hoti thin jo main usay batana chahta tha. Koi chhoti si baat, koi mazaahiya waqia, koi aisi cheez jo mujhe achhi lagti, ya koi aisa lamha jis par main chahta ke woh bhi mere saath hase.</p>

<p>Ab jab aisa kuch hota, to zehan mein uska khayal aa jata. Main sochta ke Zahra hoti to shayad is baat par kya kehti. Woh sunti to hans deti ya koi apna mazaahiya jawab deti. Phir ek pal ke liye yaad aata ke ab hamare darmiyan rabta nahi hai. Yeh chhota sa ehsaas baar baar samjhata ke meri zindagi ka ek purana mamool ab baqi nahi raha.</p>

<p>Uski kami sirf raat ko nahi hoti thi. Kabhi din ke darmiyan bhi uska khayal aa jata. Kabhi koi naam yaad dila deta, kabhi koi jagah aur kabhi koi aisi baat jo pehle hamari guftagu ka hissa hua karti thi. Yaadein hamesha kisi khaas waqt ka intezar nahi kartin. Kabhi woh achanak saamne aa jaati hain aur insaan kuch dair ke liye apne guzre hue dinon mein laut jata hai.</p>

<p>Mujhe hamare nicknames bohat yaad aate thay. Meri Mah Girlee, Meri Tamatar Girlee, Meri Mah Tamatarrr aur meri woh chhoti si guriya. Main ne in naamon ko kisi kitaab se nahi uthaya tha. Yeh hamari apni guftagu ka hissa ban gaye thay. In mein hamara apna mazaaq tha, apnapan tha aur ek aisi saadgi thi jo sirf hamare darmiyan samajh aati thi.</p>

<p>Jab main sochta ke ab main usay in naamon se nahi bula sakta, to mujhe ehsaas hota ke aadat ka rishta kitna gehra hota hai. Naam kehna apne aap mein chhoti si baat hai, lekin jab kisi naam ke saath yaadein judi hon, to woh sirf alfaaz nahi rehta. Woh ek waqt, ek chehra aur ek poori kahani yaad dila deta hai.</p>

<p>Hamari pehli mulaqat bhi mere zehan mein baar baar aati. Mujhe yaad tha ke pehli nazar mein woh mujhe ek aam si larki lagi thi, lekin phir uski aankhon aur uske andaaz ne meri tawajju kheench li. Main ne apni behan se uske baare mein poocha tha aur jab uska naam maloom hua, to mujhe laga ke ab us se baat karne ka raasta mil gaya hai.</p>

<p>Phir woh pehla paighaam tha. Mujhe yaad hai ke main ne usay bataya tha ke hum shopping wali jagah par mile thay aur ek doosray ko wahan dekha tha. Us paighaam ke baad shuru hone wali guftagu dheere dheere hamari kahani ban gayi. Kabhi kabhi main sochta tha ke zindagi ke kitne bare mor kisi chhote se qadam se shuru ho jaate hain.</p>

<p>Uske baad ka hafta, mera izhar aur uska haan kehna bhi meri yaadon ka hissa tha. Woh lamha mere liye ek nayi umeed lekar aaya tha. Main ne kabhi nahi socha tha ke wohi rishta ek din meri yaadon mein itni khamoshi ke saath reh jayega.</p>

<p>Jinnah Park ki mulaqat ko yaad karna ek alag ehsaas tha. Woh hamara pehla saamne baith kar waqt guzarna tha. Uski baatein, meri tawajju aur woh umar wala mazaaq — main un sab ko yaad karta to kuch dair ke liye dil mein purani muskurahat aa jati. Phir yaad aata ke woh din ab guzar chuka hai aur main usay dobara usi tarah jee nahi sakta.</p>

<p>Magar har yaad ka matlab sirf udaasi nahi hota. Kuch yaadein insaan ko yeh bhi yaad dilati hain ke usne apni zindagi mein khushi mehsoos ki thi. Usne kisi ko apna samjha tha. Usne kisi ki baat ko ahmiyat di thi aur kisi ki maujoodgi se apne din ko behtar mehsoos kiya tha. Main Zahra ke saath guzre hue waqt ko sirf is liye be-qeemat nahi keh sakta tha ke hamari kahani us tarah aage nahi barh saki jaisa main chahta tha.</p>

<p>Phir bhi, uski aadat ka chhootna aasaan nahi tha. Main kabhi kabhi apne aap se kehta:</p>

<div class="dialogue">Zahra ki aadat thi mujhe, aur aadat mohabbat se zyada khatarnak hoti hai.</div>

<p>Is jumlay mein mere liye ek gehra ehsaas chhupa hua tha. Mohabbat ko insaan apne dil mein ek jazbay ke taur par samajh sakta hai, lekin aadat roz ki zindagi mein jagah bana leti hai. Jab woh jagah khaali hoti hai, to insaan ko baar baar uski kami mehsoos hoti hai.</p>

<p>Main yeh bhi jaanta tha ke kisi ko yaad karne ka matlab yeh nahi ke zindagi hamesha usi mor par ruk jaye. Main apni yaadon ko sambhalte hue bhi apne din guzar sakta tha. Main Zahra ke liye achhi dua rakh sakta tha aur apni zindagi ke doosray kaamon ko bhi ahmiyat de sakta tha. Dono baatein ek doosray ke khilaaf nahi thin.</p>

<p>Lekin us waqt meri kahani mein sab se numaya cheez uski kami thi. Uski baatein, uski hansi, uska naam aur hamare darmiyan ki woh chhoti chhoti shararatein jo kabhi din ka mamooli hissa hua karti thin. Main unhein yaad karta aur samajhne ki koshish karta ke kisi ki aadat ban jana insaan ke andar kitni gehri jagah bana sakta hai.</p>

<p>Waqt guzarta raha, magar meri yaadon mein Zahra ka safha band nahi hua. Main usay apni zindagi ka ek guzra hua hissa samajhne ki koshish karta raha, lekin woh hissa mere liye aham tha. Aur kuch aham safhon ko insaan apni kitaab se phaar kar nahi nikalta; woh unhein apni kahani ka hissa maan kar aage barhta hai.</p>
`

{
title: "Khamoshi Ke Baad Bhi",
label: "Baab 61 · Rabta Khatam, Yaadein Nahi",
body: `
<p>Hamare darmiyan rabta khatam ho gaya tha. Na koi naya paighaam aata tha, na pehle ki tarah guftagu hoti thi aur na hi mujhe uske roz ke halaat ka pata chalta tha. Yeh baat apne aap mein bohat saadah lagti hai, lekin jab koi shakhs takreeban do saal tak aapki zindagi ka hissa raha ho, to uski khamoshi ko samajhne mein waqt lag sakta hai.</p>

<p>Pehle jab din mein koi baat hoti, to main sochta tha ke Zahra ko bataunga. Kabhi koi chhota sa mazaahiya waqia hota, kabhi koi baat mujhe pareshan karti aur kabhi bas dil chahta ke us se guftagu ho. Ab woh khayal aata to mujhe yaad karna padta ke hamare darmiyan pehle jaisa rabta nahi raha.</p>

<p>Yeh khamoshi kisi ek jagah tak mehdood nahi thi. Woh hamari guftagu mein thi, hamare roz ke mamool mein thi aur un chhoti chhoti baaton mein bhi thi jin par pehle hum ek doosray ko jawab diya karte thay. Main uski zindagi ke baare mein andaza laga sakta tha, lekin main yeh nahi keh sakta tha ke mujhe maloom hai woh kya soch rahi hai ya uske dil mein kya chal raha hai.</p>

<p>Uske aakhri alfaaz mujhe yaad thay: “Main tumhein kabhi nahi bhoolungi.” Main un alfaaz ko apni yaad ke taur par sambhal kar rakhta tha. Lekin main yeh bhi jaanta tha ke kisi ke dil mein kya hai, yeh main door baith kar tay nahi kar sakta. Us jumlay ki mere liye ahmiyat apni jagah thi, magar uski zindagi aur uske ehsaas usi ke thay.</p>

<p>Kabhi main sochta tha ke kya usay bhi hamari koi yaad achanak aa jaati hogi? Kya Jinnah Park ka din usay bhi yaad hoga? Kya chalees minute wala mazaaq uske zehan mein kabhi ubharta hoga? Kya hamare nicknames usay bhi hamari purani guftagu yaad dilate honge? Yeh sawal mere zehan mein aa sakte thay, lekin unke jawab mere paas nahi thay.</p>

<p>Main ne dheere dheere samjha ke yaad aur rabtay mein farq hota hai. Yaad kisi insaan ke andar reh sakti hai, lekin rabta tabhi mumkin hota hai jab dono taraf se uska raasta maujood ho. Sirf apni taraf se kisi ko yaad karna usay paighaam bhejne ya uski zindagi mein dobara dakhil hone ka haq nahi deta.</p>

<p>Is liye main ne uski zindagi ke baare mein apni taraf se kahaniyan banane ke bajaye apni yaadon ko unki asal jagah dene ki koshish ki. Mujhe nahi pata tha ke woh kis tarah apne din guzar rahi hai. Main sirf apna tajurba bayan kar sakta tha: uski kami mujhe mehsoos hoti thi, hamari yaadein mere saath thin aur main us waqt ke maani samajhne ki koshish kar raha tha.</p>

<p>Jab main apne guzre hue waqt ko dekhta, to mujhe sirf aakhri mulaqat nazar nahi aati thi. Mujhe us se pehle ke tamam din bhi yaad aate thay. Woh din jab hum hansay thay, woh din jab hamare darmiyan narazgi hui aur phir sulah ho gayi, woh baarish wala din aur woh saadah lamhay jab hum ek doosray ki baaton mein waqt bhool jaate thay.</p>

<p>Yeh sab meri kahani ka hissa tha. Agar main sirf judaai ko yaad karta, to shayad main apne guzre hue waqt ki poori tasveer nahi dekh pata. Hamari kahani mein mushkil bhi thi aur khushi bhi. Umeed bhi thi aur be-yaqeeni bhi. Aur ab khamoshi thi, jis ke saath mujhe jeena seekhna tha.</p>

<p>Kuch log zindagi mein hamesha ke liye saath rehte hain, aur kuch log hamari zindagi ka ek aisa hissa ban jaate hain jo khatam hone ke baad bhi yaadon mein rehta hai. Main yeh tay nahi kar sakta tha ke Zahra ke saath meri kahani ka aakhri matlab kya hai. Main sirf itna jaanta tha ke uska meri zindagi mein aana mere liye aham tha.</p>

<p>Is khamoshi ke darmiyan main ne uske liye dua karna nahi chhora. Main chahta tha ke woh jahan bhi ho, khairiyat se ho. Zindagi uske liye aasaan ho. Usay sukoon mile aur woh apne halaat mein behtar faislay kar sake. Kisi ko dil se chahne ka matlab yeh bhi ho sakta hai ke aap uski khushi ki dua karein, chahe aap uski roz ki zindagi ka hissa na rahe hon.</p>

<p>Main apni taraf se bhi zindagi ko aage le jana chahta tha. Yaadein mere saath thin, lekin mere aage bhi din thay. Mujhe yeh seekhna tha ke kisi guzre hue rishte ko ahmiyat dene ka matlab apni zindagi ko hamesha ke liye rok dena nahi hota. Main Zahra ko yaad kar sakta tha aur phir bhi apne mustaqbil ke liye qadam utha sakta tha.</p>

<p>Phir bhi, mere dil mein ek chhoti si umeed baqi thi. Koi wada nahi, koi yaqeen nahi aur na hi koi aisa andaza jis ki bunyaad par main keh sakta ke woh zaroor laut kar aayegi. Bas ek khayal tha ke duniya bohat bari hai, zindagi mein raaste kabhi kabhi ghair-mutawaqqa taur par mil jaate hain aur mumkin hai ke kisi din hamara saamna phir ho jaye.</p>

<p>Main us umeed ko apni zindagi ka faisla nahi banana chahta tha. Main bas usay ek khayal ki tarah apne dil mein rehne deta tha. Agar kabhi mulaqat hui, to woh apne waqt aur halaat ke mutabiq hogi. Aur agar aisa na hua, to bhi hamare guzre hue waqt ki yaad apni jagah rahegi.</p>

<p>Hamare darmiyan rabta nahi raha tha. Lekin meri kahani mein Zahra ka zikr ab bhi maujood tha. Uski pehli nazar, uski halki bhoori aankhein, uska naam, uski hansi aur uske aakhri alfaaz — yeh sab meri yaadon ke us safhe par likha tha jise main ab tak band nahi kar saka tha.</p>
`
}

<p>Kabhi kabhi insaan ke dil mein ek aisa khayal rehta hai jise woh na poori tarah umeed keh sakta hai aur na hi sirf ek khwab. Woh bas ek mumkin si baat hoti hai. Aap jaante hain ke uske poora hone ki koi guarantee nahi, lekin phir bhi kabhi kabhi zehan us manzar ko tasavvur kar leta hai.</p>

title: "Woh Safha Jo Dil Mein Reh Gaya",
label: "Baab 64 · Teri Meri Kahani Ka Aakhri Safha",
body: `
<p>Har kahani ka ek aaghaz hota hai. Kuch kahaniyan kisi khaas din, kisi bari khushi ya kisi yaadgar waqia se shuru hoti hain. Aur kuch kahaniyan bilkul saadah tareeqe se shuru hoti hain — ek nazar, ek mulaqat aur ek aisa ehsaas jis ka us waqt insaan ko khud bhi poora andaza nahi hota.</p>

<p>Meri aur Zahra ki kahani bhi ek aisi hi mulaqat se shuru hui thi. Eid ki shopping ka din tha. Dono ghar walay apni apni shopping mein masroof thay. Main ne usay pehli baar dekha. Pehle woh mujhe ek aam si larki lagi, lekin phir meri nazar uski halki bhoori aankhon par thehar gayi. Us waqt mujhe nahi pata tha ke yahi aankhein aane wale waqt mein meri bohat si yaadon ka hissa ban jayengi.</p>

<p>Us mulaqat ke baad main ne apni behan se uske baare mein poochna shuru kiya. Mujhe sirf itna maloom tha ke woh usi college mein parhti hai jahan meri behan jaati thi. Main ne usay apne andaaz mein Zahra ka huliya bataya. Meri behan ne kaha ke shayad uski class mein koi aisi larki hai. Phir naam ki tasdeeq hui aur mujhe uski ID mil gayi.</p>

<p>Us waqt Snapchat par pehla paighaam bhejna mere liye ek chhota sa qadam tha, magar uske baad jo kuch hua, woh meri zindagi ke takreeban do saal ka hissa ban gaya. Shuru ke teen chaar din aam guftagu hoti rahi. Phir baatein barhne lagin. Ek hafta guzra aur main ne apne dil ki baat keh di. Zahra ne haan keh diya.</p>

<p>Mujhe aaj bhi yaad hai ke us waqt mere andar ek naya ehsaas paida hua tha. Main khush tha, lekin us khushi ko poori tarah bayan karne ke liye mere paas alfaaz nahi thay. Mujhe lagta tha ke ab mere paas koi aisa shakhs hai jiske saath main apni roz ki baatein share kar sakta hoon. Main usay jaan sakta hoon aur woh mujhe samajh sakti hai.</p>

<p>Phir hamare darmiyan baatein barhti gayin. Hum ne ek doosray ki pasand aur na-pasand samjhi. Kabhi mazaaq hota, kabhi sanjeeda guftagu aur kabhi chhoti si baat par narazgi. Magar inhi mamooli lamhon se hamara rishta apni ek alag shakal leta gaya.</p>

<p>Zahra ke liye mere paas bohat se naam thay. Meri Mah Girlee, Meri Tamatar Girlee, Meri Mah Tamatarrr, Meri Choti Si Guriya, Meri Nanhi Si Pari aur meri pyari si Guddi. Main jab usay in naamon se bulata tha, to hamari guftagu mein ek apna sa rang aa jata tha. Uska sharma jana, hans dena ya meri baat ka jawab dena — yeh chhoti chhoti cheezein mere liye khaas ban gayi thin.</p>

<p>Phir terah August do hazaar chaubees ka din aaya. Jinnah Park mein hamari mulaqat hui. Zahra ne siyah libas pehna hua tha aur main safed libas mein tha. Hum ne bohat si baatein ki thin. Woh bolti rahi aur main sunta raha. Jab jaane ka waqt aaya, to usne kaha ke woh mujh se meri umar poochna bhool gayi thi. Main ne muskura kar jawab diya, “Chalees minute.”</p>

<p>Yeh ek chhota sa mazaaq tha, lekin aaj tak meri yaadon mein zinda hai. Shayad is liye ke kuch yaadein apni saadgi ki wajah se dil ke qareeb rehti hain. Unke liye kisi bari wajah ki zaroorat nahi hoti. Bas woh lamha kisi apne ke saath guzra hota hai.</p>

<p>Hamari kahani mein baarish ka din bhi tha. Woh baarish jis mein hum bheeg gaye thay. Main usay apne ghar le gaya, uske liye meri behan ke kapron ka intizam kiya, phir chai banayi aur khana tayyar kiya. Woh koi filmi mahal nahi tha aur na hi koi ghair-mamooli manzar. Bas ek saada sa din tha jahan hum ne ek doosray ke saath waqt guzara.</p>

<p>Mujhe woh lamhay bhi yaad hain jab Zahra mere paas baith kar apna sar meri god mein rakh leti thi. Main uske baalon mein aahista aahista haath pherta aur woh pur-sukoon ho kar aankhein band kar leti. Un lamhon mein kisi bari baat ki zaroorat nahi hoti thi. Kabhi kabhi saath baithna, khamoshi se ek doosray ki maujoodgi mehsoos karna aur kuch dair ke liye duniya ki bhaag daur se door ho jana hi kaafi hota hai.</p>

<p>Haan, hamare darmiyan narazgiyan bhi hui thin. Ek baar shaadi mein jaane ki baat par hamara nazariya mukhtalif tha. Main fikr ki wajah se nahi chahta tha ke woh jaye, jab ke uski apni marzi aur apni baat thi. Us waqia ne mujhe yeh samjhaya ke kisi ki fikr karna aur uski marzi ka ehtram karna dono zaroori hain. Phir waqt ke saath hum ne apni narazgi ko samajhne aur suljhane ki koshish ki.</p>

<p>Hamari kahani sirf khushi se nahi bani thi. Us mein chhoti chhoti ghalat fehmiyan bhi thin, seekhne ke lamhay bhi aur ek doosray ko behtar samajhne ki koshish bhi. Isi liye mere liye woh do saal sirf ek yaad nahi thay. Woh ek aisa safar tha jis mein main ne kisi ko apna samjha, uski aadaton ko jaana aur apne din ka ek hissa uske saath jor diya.</p>

<p>Phir halaat badalne lage. Zahra ke cousin ka rishta uske ghar mein aaya aur uske walid hamare rishte par razi nahi thay. Zahra pareshan thi. Usne kaha ke use samajh nahi aa raha ke woh apne walid ko kaise samjhaye. Main chahta tha ke koi raasta nikle. Main chahta tha ke hamari baat samjhi jaye. Lekin har koshish ke bawajood woh raasta hamare liye aasaan nahi hua.</p>

<p>Yeh hamari kahani ka sab se mushkil mor tha. Is se pehle hamare sawal aksar yeh hotay thay ke kab milna hai, kya baat karni hai aur ek doosray ko kaise khush rakhna hai. Ab sawal yeh tha ke hamara mustaqbil kya hoga. Main uski pareshani ko samajhna chahta tha, lekin main uske ghar ke faislay apne ikhtiyar mein nahi le sakta tha.</p>

<p>Hum ne apni taraf se koshish ki. Umeed bhi rakhi. Magar aakhir woh waqt aa gaya jab humein qabool karna pada ke hum jis natije ki khwahish rakhte thay, woh hamare liye mumkin nahi ho pa raha tha. Main ne Zahra ko Allah ke hawale kar diya. Is ka matlab yeh nahi tha ke main ne usay bhula diya tha. Is ka matlab yeh tha ke ab main uski khair chahta tha, uske liye dua kar sakta tha aur un halaat ko zabardasti badalne ki koshish nahi kar sakta tha jo mere ikhtiyar mein nahi thay.</p>

<p>Phir hamari aakhri mulaqat hui. Zahra ro rahi thi. Uski aankhon mein aansu thay aur hamare saamne guzre hue waqt ki yaadein thin. Main us din ko aaj bhi yaad karta hoon, kyun ke woh sirf ek mulaqat ka aakhri lamha nahi tha. Woh takreeban do saal ki kahani ka woh mor tha jahan se hamari roz ki guftagu khamoshi mein badal gayi.</p>

<p>Usne rote hue kaha tha:</p>

<div class="dialogue">“Main tumhein kabhi nahi bhoolungi.”</div>

<p>Main nahi jaanta tha ke us waqt uske dil mein kitne ehsaas thay. Main uski taraf se mustaqbil ka koi faisla nahi suna sakta. Main sirf apna ehsaas jaanta tha. Main usay apni zindagi mein ahmiyat deta tha, aur uske saath guzra hua waqt mere liye qeemti tha.</p>

<p>Us mulaqat ke baad hamara rabta khatam ho gaya. Na pehle jaisi guftagu rahi, na roz ek doosray ka haal poochhna aur na hi woh chhoti chhoti baatein jo kabhi hamari zindagi ka mamool thin. Main ne uski kami mehsoos ki. Kabhi kisi baat par uska khayal aata, kabhi koi yaad achanak saamne aa jati aur kabhi main sochta ke woh hoti to is baat par kya kehti.</p>

<p>Tab mujhe samajh aaya ke Zahra sirf meri mohabbat nahi, meri aadat bhi ban chuki thi. Uski baat karne ka andaaz, uski hansi aur usay bulane ke mere pyare se naam — yeh sab meri roz ki zindagi ka hissa thay. Jab woh silsila khatam hua, to uski kami ko samajhne mein waqt laga.</p>

<p>Zahra ki aadat thi mujhe, aur aadat mohabbat se zyada khatarnak hoti hai.</p>

<p>Magar waqt ke saath main ne yeh bhi seekha ke yaadon ke saath jeena aur apni zindagi ko rok dena ek baat nahi. Main usay yaad kar sakta hoon, uske liye dua kar sakta hoon aur phir bhi apni zindagi ke aglay din ki taraf qadam utha sakta hoon. Main uske guzre hue waqt ki qadar kar sakta hoon, bina is ke ke uske mustaqbil ke baare mein koi dawa karun.</p>

<p>Aaj bhi mere dil mein uske liye khair ki dua hai. Main chahta hoon ke woh jahan bhi ho, khush ho, mehfooz ho aur uski zindagi mein sukoon ho. Main nahi jaanta ke woh kabhi meri kahani ko yaad karti hai ya nahi. Main yeh bhi nahi jaanta ke hamari mulaqat dobara kabhi hogi ya nahi. Lekin main apni taraf se uske liye achha chahta hoon.</p>

<p>Kabhi kabhi dil sochta hai ke shayad kisi din kisi anjaani jagah par hamari nazar phir mil jaye. Shayad hum ek doosray ko pehchan lein. Shayad Jinnah Park ka din yaad aa jaye, ya chalees minute wala mazaaq. Shayad us pal mein hamari purani kahani ka koi safha phir se zehan mein khul jaye.</p>

<p>Lekin yeh sirf ek umeed hai, koi wada nahi. Zindagi kis ko kis raaste par le jaye, yeh pehle se maloom nahi hota. Main us umeed ko apni zindagi ka faisla nahi banata. Main bas itna jaanta hoon ke agar kabhi mulaqat hui, to woh apne waqt par hogi. Aur agar kabhi na hui, to bhi hamari kahani ka guzra hua waqt meri yaadon ka hissa rahega.</p>

<p>Is kahani ko likhte hue main ne har khushi ko sirf khushi aur har dukh ko sirf dukh samajhne ke bajaye dono ko ek saath yaad karne ki koshish ki hai. Kyun ke hamara safar sirf aakhri mulaqat tak mehdood nahi tha. Woh pehli nazar se shuru hua tha, baaton se aage barha tha, mulaqaton mein yaadein bana gaya tha aur phir halaat ke saamne ek aise mor par aa gaya jahan se hum alag raaston par chal diye.</p>

<p>Yeh meri taraf ki kahani hai. Is mein meri yaadein hain, mere ehsaas hain aur woh lamhay hain jinhein main ne apne dil mein mehfooz rakha. Main Zahra ke dil ki har baat ka dawa nahi karta. Main bas us waqt ko apni nazar se bayan karta hoon jis ne meri zindagi mein apni ek jagah bana li.</p>

<p>Kuch mulaqatein chand lamhon ki hoti hain, magar unki yaad bohat lambi ho jaati hai. Kuch log hamare saath poori zindagi nahi guzarte, magar unke saath guzra hua waqt hamari kahani mein hamesha likha rehta hai. Aur kabhi kabhi insaan kisi safhe ko band karne ki koshish karta hai, lekin us safhe par likhe alfaaz uske dil mein reh jaate hain.</p>

<p>Yeh kahani bhi mere liye ek aisa hi safha hai. Is ka aaghaz ek mulaqat se hua tha. Darmiyan mein mohabbat thi, hansi thi, chhoti chhoti shararatein thin, baarish aur chai thi, Jinnah Park ki yaad thi, phir mushkil halaat thay, aansu thay aur judaai thi. Ab is safhe par khamoshi hai — aur woh umeed jo kisi din dobara mulaqat ke khayal mein zinda ho uthti hai.</p>

<p>Magar kahani ka aakhri jumla wohi hai jahan mera dil ab tak thehra hua hai.</p>

<p>Aur us mulaqat ka anjaam yeh tha ke kahani khatam ho gayi, magar main aaj tak usi safhe par ruka hoon.</p>
