<p>Hamari baat shuru ho chuki thi, lekin shuru ke teen chaar din sab kuch mamool ke mutabiq tha. Guftagu hoti, kuch sawal jawab hotay aur phir apni apni zindagi ke kaam. Abhi woh apnapan paida nahi hua tha jo baad mein hamari baaton ki sab se khoobsurat pehchaan bana.</p>

<p>Main usay samajhne ki koshish kar raha tha. Uske jawab ka andaaz, uski baat karne ka tareeqa aur woh kis tarah kisi sawal ka jawab deti thi. Main har chhoti baat ko mohabbat ka naam nahi dena chahta tha. Main jaanta tha ke kisi ko samajhne ke liye waqt dena zaroori hota hai.</p>

<p>Un dinon mein hamare darmiyan abhi woh gehri qurbat nahi thi jo baad mein paida hui. Lekin har nayi guftagu ke saath ek naya pehlu saamne aata. Kal jo baat anjaan thi, aaj uska chhota sa hissa maloom ho jata. Aur phir aglay din baat karne ke liye koi naya mauzu mil jata.</p>

<p>Shayad us waqt Zahra ke liye bhi main bas ek naya shakhs tha. Woh bhi mujhe samajh rahi hogi, meri baaton ko parakh rahi hogi aur yeh jaanne ki koshish kar rahi hogi ke main kis tarah ka insaan hoon. Kisi naye insaan ko apni zindagi mein jagah dene se pehle usay waqt dena fitri baat hai.</p>

<p>Mujhe yeh baat achhi lagti thi ke hum ek doosray se baat kar rahe thay. Main us se baat karne ke liye koi bahana banane ke bajaye guftagu ko apni raftaar se chalne dena chahta tha. Main nahi chahta tha ke jaldi mein kisi rishte ka naam rakh diya jaye jab hum ek doosray ko abhi poori tarah jaante bhi nahi thay.</p>

<p>Un pehle chand dinon ki ahmiyat mujhe baad mein samajh aayi. Jab insaan kisi kahani ke darmiyan hota hai to usay har lamha mamooli lagta hai. Lekin jab wohi kahani yaad ban jaye, to uska har chhota hissa apni jagah rakhne lagta hai.</p>

<p>Hamari kahani bhi dheere dheere aage barh rahi thi. Abhi izhaar nahi hua tha. Abhi koi wada nahi tha. Bas do log thay jo baat karna shuru kar chukay thay, aur unke darmiyan ek aisa silsila ban raha tha jis ka anjaam un dono mein se kisi ko maloom nahi tha.</p>
`
},

{
title: "Uski Baaton Ka Andaaz",
label: "Baab 7 · Apnapan",
body: `
<p>Jab hamari guftagu ka silsila barha, to mujhe sirf Zahra ka chehra yaad nahi rehta tha. Ab uski baatein bhi zehan mein rehne lagi thin. Kisi insaan ko door se dekhna aur us se baat karke uski shakhsiyat ko samajhna do bilkul mukhtalif tajurbe hain.</p>

<p>Pehle main uski halki bhoori aankhon ko yaad karta tha. Ab mere paas uske alfaaz bhi thay. Main uske baat karne ke andaaz ko pasand karne laga tha. Kabhi ek saada sa jawab bhi dil ko achha lagta, kabhi uski baat ka koi chhota sa pehlu der tak yaad rehta.</p>

<p>Mohabbat ka aaghaz hamesha kisi bari baat se nahi hota. Kabhi kisi ka lehja, kabhi uska tawajjo dena aur kabhi uska aapki baat ko samajhne ki koshish karna dil mein jagah bana leta hai. Mere saath bhi kuch aisa hi ho raha tha.</p>

<p>Main ne mehsoos kiya ke main usay sirf dekhne ki wajah se yaad nahi karta tha. Ab main us se baat karna bhi chahta tha. Uske jawab ka intezar sirf tajassus nahi raha tha. Main chahta tha ke hamari guftagu chalti rahe, ke main usay aur jaanun aur woh bhi mujhe samajhne ka mauqa paaye.</p>

<p>Uski baaton mein mujhe ek aisa apnapan mehsoos hone laga jo pehli mulaqat mein mumkin nahi tha. Main uski har baat ko khoobsurat banane ki koshish nahi kar raha tha. Woh apni jagah ek haqeeqi insaan thi, apni pasand, apni soch aur apne mizaj ke saath. Shayad isi liye usay samajhne ka safar mere liye itna dilchasp hota ja raha tha.</p>

<p>Ab hamare paas sirf pehli mulaqat ka zikr nahi tha. Hamari apni guftagu ban rahi thi. Aise mauzuaat jin par baat karne ke liye bazaar ki us mulaqat ka hawala dene ki zaroorat nahi thi. Dheere dheere hum ek doosray ko apni baaton ke zariye jaan rahe thay.</p>

<p>Yeh woh waqt tha jab main apne dil mein paida hotay hue ehsaas ko samajhne ki koshish kar raha tha. Main usay pasand karne laga tha, lekin is pasand ko alfaaz dene se pehle main chahta tha ke hamara apnapan mazboot ho.</p>
`
},

{
title: "Jab Main Use Samajhne Laga",
label: "Baab 8 · Ek Doosray Ko Jaanna",
body: `
<p>Waqt ke saath hamari baaton mein woh jhijhak kam hone lagi jo shuru mein har nayi jaan-pehchaan ka hissa hoti hai. Ab guftagu karte waqt mujhe har jumla soch samajh kar likhne ki zaroorat pehle jaisi mehsoos nahi hoti thi. Hamare darmiyan ek aisa silsila ban raha tha jahan hum apni baat keh sakte thay aur doosray ki baat sun sakte thay.</p>

<p>Main uski pasand aur na-pasand ke baare mein jaanne laga. Mujhe lagta tha ke agar main waqai usay samajhna chahta hoon to sirf apni baat karna kaafi nahi. Mujhe uski baat bhi sunni hogi, uske nazariye ko samajhna hoga aur yeh qabool karna hoga ke do logon ki soch har baat par ek jaisi nahi hoti.</p>

<p>Us waqt hamare darmiyan chhoti chhoti baatein bhi ahmiyat rakhne lagi thin. Kisi baat par hans dena, kisi sawal ka jawab dena, ya kisi din thori der zyada guftagu ho jana. Inhi chhoti cheezon se jaan-pehchaan gehri hoti hai.</p>

<p>Main ne yeh bhi mehsoos kiya ke kisi ko pasand karna sirf uski achhi baaton ko dekhna nahi hota. Kisi ko samajhne ka matlab hai ke aap uski apni shakhsiyat ko jagah dein. Uske khayalat sunen, uski baat ko ahmiyat dein aur usay apni marzi ke mutabiq badalne ki koshish na karein.</p>

<p>Zahra ke saath meri guftagu ab pehle se zyada aasaan hoti ja rahi thi. Main uske baare mein aur jaanna chahta tha aur saath hi chahta tha ke woh bhi mujhe samajh sake. Shayad woh bhi yahi kar rahi thi. Hum dono ke darmiyan abhi bohat kuch jaan-na baqi tha, magar pehla qadam uth chuka tha.</p>

<p>Kabhi main sochta ke agar us din Eid ki shopping par meri nazar us par na pari hoti to kya hota? Shayad main usay kabhi na jaanta. Shayad hamari zindagiyan apne apne raaston par chalti rehtin aur yeh kahani kabhi shuru hi na hoti.</p>

<p>Lekin zindagi ke guzray hue lamhon ko badla nahi ja sakta. Jo hua, woh meri yaadon ka hissa ban chuka tha. Aur us waqt main bas aage barh raha tha, yeh jaane baghair ke chand din baad mujhe us se ek aisa sawal poochna tha jo hamari kahani ka rukh badal sakta tha.</p>
`
},

{
title: "Ek Hafte Ka Safar",
label: "Baab 9 · Dil Ki Aahat",
body: `
<p>Takreeban ek hafta guzar chuka tha. Yeh sirf chand din thay, lekin in chand dinon mein ek anjaan chehra dheere dheere meri rozmarrah ki soch ka hissa banne laga tha. Pehle main usay bazaar mein dekh kar yaad karta tha. Phir main uske naam ko pehchaanne laga. Aur ab main us se baat karne ka muntazir rehta tha.</p>

<p>Main is ehsaas ko samajhne ki koshish karta. Kya yeh sirf pasand thi? Kya yeh ek nayi jaan-pehchaan ka asar tha? Ya phir main waqai usay apni zindagi mein ek khaas jagah dena chahta tha? Mere paas har sawal ka tayyar jawab nahi tha, lekin ek baat wazeh hoti ja rahi thi: main usay aam jaan-pehchaan se zyada ahmiyat dene laga tha.</p>

<p>Us ek haftay mein hamari guftagu ne mujhe uske baare mein pehle se zyada sochne ka mauqa diya. Main usay sirf apni pasand ke mutabiq tasawwur nahi karna chahta tha. Main chahta tha ke main usay usi tarah jaanun jaisi woh asal mein thi.</p>

<p>Kabhi kabhi dil kisi baat ko zubaan tak lane se pehle bohat dair tak apne andar rakhta hai. Insaan sochta hai ke agar keh diya to kya hoga. Agar saamne wala bhi aisa hi mehsoos karta ho to? Aur agar uska jawab mukhtalif ho to? Dono imkaan apni apni jagah haqeeqi hotay hain.</p>

<p>Main bhi isi mor par khara tha. Mere liye yeh sirf kisi ko pasand karne ka maamla nahi raha tha. Main us se ek seedhi aur sachchi baat karna chahta tha. Main apne ehsaas ko chhupate rehne ke bajaye usay izzat ke saath uske saamne rakhna chahta tha.</p>

<p>Abhi tak main nahi jaanta tha ke Zahra kya jawab degi. Main uski taraf se koi faisla khud nahi kar sakta tha. Main bas apni baat keh sakta tha aur phir uske jawab ko qabool kar sakta tha.</p>

<p>Yahi woh din thay jab mere zehan mein ek sawal baar baar aane laga. Woh sawal jo hamari guftagu ko ek naye mor par le ja sakta tha. Main ne apne alfaaz sochne shuru kiye, lekin dil mein jo baat thi usay chand jumlon mein sametna aasaan nahi tha.</p>
`
},

{
title: "Woh Sawal",
label: "Baab 10 · Izhaar Se Pehle",
body: `
<p>Kisi ko apne dil ki baat batana aasaan nahi hota, khaas taur par jab aap ko uske jawab ka yaqeen na ho. Aap apne alfaaz ko baar baar sochte hain. Kabhi lagta hai keh dena chahiye, kabhi lagta hai thora aur waqt le lena chahiye. Main bhi isi kashmakash se guzar raha tha.</p>

<p>Main Zahra ko pasand karne laga tha. Uski aankhon se shuru hone wali yeh kahani ab uski baaton aur hamari jaan-pehchaan tak aa chuki thi. Main usay aur samajhna chahta tha, magar saath hi apne ehsaas ke baare mein bhi sachcha rehna chahta tha.</p>

<p>Main jaanta tha ke kisi bhi rishte mein dono logon ki raza-mandi zaroori hoti hai. Sirf meri pasand kisi rishte ke liye kaafi nahi thi. Zahra ka apna dil, apni soch aur apna faisla tha. Is liye jo bhi kehna tha, main chahta tha ke saaf alfaaz mein kahun aur usay jawab dene ka poora haq doon.</p>

<p>Ek hafta pehle tak woh mere liye bazaar mein dekha hua ek chehra thi. Ab us se baat karna mere din ka ek aisa hissa ban raha tha jise main khona nahi chahta tha. Lekin main yeh bhi samajhta tha ke agar main kabhi apne ehsaas ka izhaar karunga to mujhe uske jawab ke liye tayyar rehna hoga.</p>

<p>Us waqt mere dil mein umeed bhi thi aur halki si ghabrahat bhi. Main apne aap se kehta ke jo bhi hoga, kam az kam meri baat us tak pohanch jayegi. Main hamesha sochta nahi rehna chahta tha ke kaash main ne apne dil ki baat keh di hoti.</p>

<p>Is kahani ka agla safha abhi likha nahi gaya tha. Mere paas sirf ek sawal tha, kuch sachche ehsaas thay aur ek aisi umeed thi jo main ne abhi tak poori tarah alfaaz mein nahi dhalti thi.</p>

<div class="dialogue">“Kya tum meri zindagi ka hissa banna chahogi?”</div>

<p>Yeh woh baat thi jo main kehna chahta tha. Mujhe nahi pata tha ke uska jawab kya hoga. Lekin main jaanta tha ke us jawab ke baad hamari kahani pehle jaisi nahi rahegi.</p>
`
},

{
title: "Uska Haan Kehna",
label: "Baab 11 · Naya Ehsaas",
body: `
<p>Jab main ne aakhir apne dil ki baat Zahra ke saamne rakhi, to mere liye woh ek aham lamha tha. Takreeban ek hafta guftagu karne ke baad main usay bata raha tha ke meri pasand ab sirf ek aam si pasand nahi rahi. Main usay apni zindagi mein ek khaas jagah dena chahta tha.</p>

<p>Uska jawab mere liye bohat ahmiyat rakhta tha. Main ne apni taraf se baat keh di thi, lekin faisla uska tha. Main nahi chahta tha ke meri umeed us par kisi qisam ka dabao banay. Mere liye zaroori tha ke woh apni marzi aur apne ehsaas ke mutabiq jawab de.</p>

<p>Phir Zahra ne haan keh diya.</p>

<p>Woh chhota sa jawab mere liye ek naya darwaza kholne jaisa tha. Main ne us waqt jo mehsoos kiya, usay lafzon mein sametna aaj bhi aasaan nahi. Yeh mere liye ek naya ehsaas tha, aisa ehsaas jis se main pehle waqif nahi tha.</p>

<p>Ab hamare darmiyan sirf ek pehchaan nahi thi. Hum ne ek doosray ko apne rishte ka mauqa diya tha. Iska matlab yeh nahi tha ke hum ek doosray ko poori tarah jaan chukay thay. Balkay ab ek doosray ko samajhne ki zimmedari aur bhi barh gayi thi.</p>

<p>Main khush tha, magar us khushi ke saath ek sanjeedgi bhi thi. Kisi ka haan keh dena sirf ek khoobsurat lamha nahi hota. Yeh ek doosray ki izzat karne, sach bolne aur baat ko samajhne ka aaghaz bhi hota hai.</p>

<p>Us din ke baad jab main hamari pehli mulaqat ko yaad karta, to woh pehle se mukhtalif lagti. Ab mujhe pata tha ke us anjaan chehre ka naam Zahra hai. Ab uski baatein meri yaadon ka hissa thin. Aur ab hamari kahani mein ek naya rishta shuru ho chuka tha.</p>

<p>Mujhe us waqt bilkul andaza nahi tha ke aane wale do saal hamari zindagi mein kitni yaadein jama kar denge. Main bas us lamhe ki khushi mehsoos kar raha tha, aur chahta tha ke hum apni guftagu aur apnapan ko samajhdaari se aage barhayein.</p>
`
},

{
title: "Meri Mah Girlee",
label: "Baab 12 · Mohabbat Ki Zubaan",
body: `
<p>Rishte ke shuru hone ke baad hamari baaton mein ek narmi aur apnapan aane laga. Ab main usay sirf Zahra keh kar nahi pukarta tha. Dheere dheere kuch aise naam hamari guftagu ka hissa banne lage jo mere liye bohat khaas thay.</p>

<p>Meri Mah Girlee, meri Tamatar Girlee, meri Mah Tamatarrr, meri Choti Si Guriya, meri Nanhi Si Pari. Yeh naam sunne mein chhote aur shararti thay, lekin hamari kahani mein inki apni jagah thi. Har nickname ke saath ek apna sa andaaz tha, ek aisi baat jo sirf hamari guftagu ko samajhne wala hi mehsoos kar sakta tha.</p>

<p>Jab main usay in naamon se pukarta aur woh sharma jaati, to mujhe hamare darmiyan paida hone wali qurbat achhi lagti. Main uski hansi aur uske masoom se reaction ko yaad rakhta. Kuch lamhay aise hotay hain jinhein kisi khaas tohfay ki zaroorat nahi hoti. Sirf ek pyara sa naam bhi kisi ke chehre par muskurahat le aata hai.</p>

<p>Hamari mohabbat ki apni zubaan ban rahi thi. Kuch alfaaz shayad doosron ko mamooli lagte, lekin hamare liye unka matlab alag tha. Un mein apnapan tha, mazaaq tha aur ek doosray ko khaas mehsoos karwane ki chhoti chhoti koshishein thin.</p>

<p>Mujhe uski yeh baat pasand thi ke woh kabhi shararti andaaz mein baat karti aur kabhi khamosh ho jaati. Har waqt ek jaisa mizaj nahi hota. Kabhi insaan ko hansna hota hai, kabhi sukoon chahiye hota hai aur kabhi bas kisi aise shakhs ki zaroorat hoti hai jo uski baat sun le.</p>

<p>Main chahta tha ke hamari guftagu mein woh apni asli shakhsiyat ke saath reh sake. Agar woh khush hoti to main uski khushi mein shareek hona chahta tha. Agar woh pareshan hoti to main usay sunna chahta tha. Mere liye mohabbat ka matlab sirf pyare naam rakhna nahi tha; un naamon ke peechay mojood insaan ko samajhna bhi tha.</p>

<p>Aaj jab main un nicknames ko yaad karta hoon, to woh sirf lafz nahi lagte. Woh hamari zindagi ke ek daur ki nishaniyan hain. Un mein woh waqt basa hai jab hamari baaton mein umeed thi, jab chhoti si guftagu bhi din ko behtar bana deti thi aur jab mujhe lagta tha ke mere paas ek aisa rishta hai jise main sambhal kar rakhna chahta hoon.</p>
`
}

,
{
title: "Ab Woh Meri Zahra Thi",
label: "Baab 13 · Ek Naya Rishta",
body: `
<p>Uske haan kehne ke baad meri zindagi mein ek naya ehsaas shamil ho gaya tha. Main jab pehli mulaqat ko yaad karta to ab woh manzar pehle jaisa nahi lagta tha. Eid ki shopping ka woh din, bheer mein nazar aane wala chehra aur uski halki bhoori aankhein—sab kuch ab ek nayi kahani ka aaghaz ban chuka tha.</p>

<p>Main ne kabhi nahi socha tha ke ek aisi mulaqat, jise main shuru mein aam samajh raha tha, meri zindagi ki itni aham yaad ban jayegi. Us waqt mujhe uska naam tak maloom nahi tha. Main ghar aaya, behan se uska zikr kiya, phir uski pehchaan hui aur aakhir Snapchat par hamari baat shuru ho gayi. Har qadam apni jagah chhota tha, magar jab main un sab ko ek saath dekhta to mujhe apni kahani ka safar samajh aata.</p>

<p>Ab Zahra mere liye sirf ek pasandida chehra nahi thi. Woh ek aisi shakhsiyat ban rahi thi jise main samajhna chahta tha. Main uski baaton, uski pasand aur uske mizaj ko jaanne laga tha. Uske saath guftagu karte hue mujhe yeh ehsaas hota ke kisi ko apni zindagi mein jagah dene ka matlab sirf usay apna keh dena nahi, balkay usay samajhne ke liye waqt nikalna bhi hai.</p>

<p>Hamare rishte ka aaghaz bohat saada tha. Hamare paas koi bari rasam nahi thi, na koi aisa lamha jise duniya ke saamne dikhana zaroori hota. Hamare paas messages thay, guftagu thi aur ek doosray ko jaanne ki khwahish thi. Shayad mere liye isi saadgi mein sab se zyada khoobsurati thi.</p>

<p>Main kabhi kabhi apne aap se poochta ke kya Zahra ko bhi woh pehla din yaad hoga? Kya usay yaad hoga ke hamari baat ka aaghaz kis tarah hua tha? Kya woh bhi kabhi sochti hogi ke agar us din main message na karta to hamari kahani kahan hoti?</p>

<p>In sawalon ke jawab hamesha mere paas nahi hotay thay. Magar ab mujhe unke jawab foran chahiye bhi nahi thay. Main chahta tha ke hum apni kahani ko waqt dein. Har naya din apni jagah ek naya safha tha, aur main un safhon ko jaldi jaldi khatam karne ke bajaye jeena chahta tha.</p>

<p>Us waqt mujhe lagta tha ke mere saamne ek khoobsurat safar hai. Main nahi jaanta tha ke zindagi mein kitne mor aane wale hain. Main bas itna jaanta tha ke ab meri roz ki soch mein Zahra ka naam shamil ho chuka tha.</p>

<div class="dialogue">“Kuch log zindagi mein achanak aate hain, lekin phir unki mojoodgi roz ke mamool ka hissa ban jaati hai.”</div>

<p>Yeh baat mujhe baad mein samajh aayi. Us waqt main bas khush tha ke jis larki ko main ne ek din bazaar mein dekha tha, ab us se meri baat hoti thi. Ek anjaan chehra ab mere liye ek naam, ek awaaz aur ek apnapan ban raha tha.</p>
`
},

{
title: "Pehli Raat Ki Khushi",
label: "Baab 14 · Naye Ehsaas",
body: `
<p>Us din ke baad jab raat hoti aur din bhar ki masroofiyat kuch kam ho jaati, to mujhe hamari guftagu yaad aati. Rishte ka aaghaz ho chuka tha, aur mere liye yeh baat apni jagah bohat khaas thi. Main apne ehsaas ko samajhne ki koshish karta rehta. Khushi thi, hairani thi aur ek nayi si zimmedari ka ehsaas bhi.</p>

<p>Main ne pehle kabhi kisi ko is tarah apni roz ki soch ka hissa bante hue mehsoos nahi kiya tha. Ab kisi chhoti si baat ka zikr karne ka dil karta to Zahra yaad aati. Koi mazaahiya baat hoti to sochta ke usay bataunga. Koi sawal zehan mein aata to lagta ke hamari agli guftagu mein us par baat kar sakte hain.</p>

<p>Yeh zaroori nahi tha ke har waqt koi khaas baat ho. Kabhi do logon ke darmiyan sirf mamooli guftagu bhi bohat sukoon deti hai. Jab aap kisi ke saath apni baat keh sakte hon, apna din bata sakte hon aur uski baat sun sakte hon, to dheere dheere ek aisa rishta banne lagta hai jo sirf bade waadon par nahi, roz ki chhoti chhoti baaton par bhi khara hota hai.</p>

<p>Main apne mustaqbil ke baare mein bohat se khayalat soch sakta tha, lekin main jaanta tha ke sirf khayal karne se zindagi ke faislay nahi ho jaate. Us waqt hamara kaam ek doosray ko samajhna tha. Mujhe Zahra ko waqt dena tha aur apni baat aur apne rawaiye se yeh dikhana tha ke main uski izzat karta hoon.</p>

<p>Us raat ki khushi ko main kisi ek jumlay mein bayan nahi kar sakta. Yeh woh khushi thi jo dil mein rehti hai aur insaan ko baar baar usi baat ki taraf le jaati hai. Main hamare pehle message ko yaad karta, phir uski taraf se aane wale jawab ko, phir woh waqt jab hamari guftagu pehle se zyada aasaan hone lagi thi.</p>

<p>Kitna ajeeb tha ke kuch din pehle tak Zahra mere liye ek anjaan larki thi. Main uska naam dhoond raha tha, uski pehchaan jaanne ki koshish kar raha tha. Aur ab hum dono ne ek doosray ko apne rishte ka mauqa diya tha.</p>

<p>Main ne us waqt apne dil mein yeh socha ke main is rishte ko achhe se nibhana chahta hoon. Main chahta tha ke hamari baat sirf aaj ki khushi tak mehdood na rahe. Hum ek doosray ko samjhein, apni ghaltiyon se seekhein aur jab kabhi koi mushkil aaye to usay baat cheet se hal karne ki koshish karein.</p>

<p>Mujhe nahi pata tha ke aane wale waqt mein kaun se din aasaan honge aur kaun se mushkil. Magar us raat main un mushkilon ke baare mein nahi soch raha tha. Main bas ek naye safar ke aaghaz ko mehsoos kar raha tha.</p>

<div class="small-ornament">❦ ✧ ❦</div>

<p>Aaj jab main us waqt ko yaad karta hoon, to mujhe lagta hai ke khushi aksar apne aane wale anjaam ka elaan nahi karti. Woh bas kuch lamhon ke liye insaan ke saath hoti hai. Us waqt humein nahi pata hota ke ek din hum unhi lamhon ko yaad karke apni guzri hui zindagi ko samajhne ki koshish karenge.</p>
`
},

{
title: "Messages Jo Khatam Nahi Hotay Thay",
label: "Baab 15 · Guftagu Ka Silsila",
body: `
<p>Hamare rishte ke saath hamari guftagu bhi dheere dheere barhti gayi. Ab baat shuru karne ke liye har baar kisi khaas wajah ki zaroorat nahi hoti thi. Kabhi koi sawal hota, kabhi kisi mamooli baat ka zikr hota aur kabhi bas ek doosray ka haal poochne ka dil karta.</p>

<p>Messages ki duniya mein waqt ka andaza kabhi kabhi badal jata hai. Insaan sochta hai ke bas chand minute baat karega, lekin phir ek baat se doosri baat nikal aati hai. Kisi purane waqia ka zikr ho jata hai, kisi pasand ka pata chal jata hai ya koi mazaahiya baat guftagu ko ek naya rukh de deti hai.</p>

<p>Mujhe Zahra ke baare mein aur jaanne ka mauqa mil raha tha. Main uski pasand aur na-pasand ko samajhna chahta tha. Main yeh bhi chahta tha ke woh meri baaton ko samjhe aur mujhe bhi apni zindagi ke chhote chhote pehlu batane mein aasani mehsoos ho.</p>

<p>Hamari guftagu ka sab se achha pehlu yeh tha ke hum ek doosray ko dheere dheere jaan rahe thay. Kisi insaan ki shakhsiyat sirf uske chand messages se samajh nahi aati. Uski baat karne ka andaaz, uska kisi mushkil baat par reaction, uski khushi aur uski khamoshi—yeh sab waqt ke saath samajh mein aate hain.</p>

<p>Kabhi main apne din ka koi chhota sa waqia usay batana chahta. Kabhi uski baat sun kar mere chehre par muskurahat aa jaati. Aisi guftagu mein zaroori nahi ke har jumla yaad reh jaye. Kabhi poori baat bhool jaati hai, lekin us baat se milne wala ehsaas yaad reh jata hai.</p>

<p>Hamari zindagi mein bhi bohat se aise mamooli lamhay thay. Woh lamhay jinhein us waqt hum ne koi khaas naam nahi diya. Hum bas baat karte thay, ek doosray ko samajhte thay aur apni jaan-pehchaan ko mazboot banate ja rahe thay.</p>

<p>Main chahta tha ke Zahra ko mere saath baat karte hue yeh mehsoos ho ke woh apni baat keh sakti hai. Agar uski soch mujh se mukhtalif hoti, to bhi uski baat sunna zaroori tha. Mohabbat ka matlab har baat par ek jaisa sochna nahi hota. Kabhi kabhi mohabbat ka matlab yeh hota hai ke aap doosray ki soch ko samajhne ke liye apni jagah se thora aage barhein.</p>

<p>Hamari guftagu isi tarah aage barhti rahi. Har din ek naya mauqa tha ke hum ek doosray ko thora aur jaan sakein. Aur har guzarta din meri pehli mulaqat ki yaad ko ek naya matlab de raha tha.</p>

<div class="dialogue">“Pehle main tumhein sirf yaad karta tha; ab tumse baat karna bhi meri yaadon ka hissa ban raha tha.”</div>

<p>Yeh alfaaz mere us waqt ke ehsaas ko bayan karte hain. Main nahi jaanta tha ke hamari chats ek din mere liye kitni qeemti yaadein ban jayengi. Us waqt main bas unhein jee raha tha.</p>
`
},

{
title: "Pasand Aur Na-Pasand",
label: "Baab 16 · Ek Doosray Ki Duniya",
body: `
<p>Kisi ko apna kehna aasaan hota hai, lekin usay samajhna waqt leta hai. Main dheere dheere yeh baat samajhne laga tha. Zahra ki apni pasand thi, apni na-pasand thi, apni aadatein thin aur apna mizaj tha. Main chahta tha ke main in sab baaton ko jaanun, kyun ke mere liye woh sirf meri pasand ka naam nahi thi. Woh apni poori shakhsiyat ke saath ek insaan thi.</p>

<p>Hamari baaton mein kabhi pasandida cheezon ka zikr hota, kabhi kisi aisi baat ka jo humein achhi nahi lagti thi. Aisi guftagu se humein yeh samajhne mein madad milti ke doosra shakhs duniya ko kis nazar se dekhta hai. Har chhoti maloomat ek naya pehlu saamne laati.</p>

<p>Main ne mehsoos kiya ke kisi ke qareeb hone ka matlab yeh nahi ke aap uski har baat pehle se jaante hon. Qareeb hone ka matlab yeh bhi hai ke aap usay roz naye sire se jaanne ke liye tayyar hon. Insaan waqt ke saath badalta hai, naye tajurbe hasil karta hai aur apne baare mein bhi bohat kuch seekhta hai.</p>

<p>Main chahta tha ke Zahra ko bhi meri pasand aur na-pasand ka pata chale. Main chahta tha ke woh mujhe sirf mere achhe lamhon mein na dekhe, balkay mujhe samajhne ka mauqa bhi paaye. Kisi rishte mein sachchai tabhi barhti hai jab dono log apni baat keh saken aur ek doosray ko sun saken.</p>

<p>Kabhi hamari pasand ek jaisi hoti hogi aur kabhi mukhtalif. Magar asal baat yeh nahi thi ke har cheez mein hum ek jaisay hon. Asal baat yeh thi ke hum ek doosray ki mukhtalif soch ko kis tarah samajhte hain.</p>

<p>Mujhe lagta tha ke yahi woh bunyaad hai jis par koi rishta mazboot ho sakta hai. Sirf pyare alfaaz aur achhe lamhay kaafi nahi hote. Bharosa, sachchai, izzat aur ek doosray ki baat sunne ki aadat bhi zaroori hoti hai.</p>

<p>Hamare liye yeh sab kuch seekhne ka waqt tha. Hum apni kahani ke shuruati safhon par thay. Abhi bohat si yaadein banani thin, bohat se lamhay jeene thay aur bohat si baatein ek doosray ko batani thin.</p>

<p>Jab main aaj us daur ko yaad karta hoon, to mujhe samajh aata hai ke hamari mohabbat sirf ek din mein nahi bani thi. Uska aaghaz ek nazar se hua tha, lekin usay gehra karne mein hamari baaton, hamare waqt aur ek doosray ko samajhne ki koshish ka hissa tha.</p>
`
},

{
title: "Jab Woh Mujhe Samajhti Thi",
label: "Baab 17 · Dil Ka Sukoon",
body: `
<p>Waqt ke saath mujhe Zahra ki ek baat bohat achhi lagne lagi: uska meri baat ko samajhne ki koshish karna. Har insaan chahta hai ke uski baat sirf suni na jaye, balkay samjhi bhi jaye. Kabhi hum apne ehsaas ko theek alfaaz mein bayan nahi kar paate, kabhi hamari baat adhoori reh jaati hai aur kabhi hum khud bhi nahi samajh paate ke humein kya pareshan kar raha hai.</p>

<p>Aise waqt mein agar koi insaan aapki baat ko tawajjo se sunay, to uski ahmiyat barh jaati hai. Mere liye Zahra ke saath bhi yahi baat aham thi. Mujhe uska baat karne ka andaaz pasand tha aur main mehsoos karta tha ke woh mujhe samajhne ki koshish karti hai.</p>

<p>Yeh zaroori nahi tha ke woh har baar meri baat se mutafiq hoti. Kisi rishte mein ikhtilaf ki gunjaish rehti hai. Magar agar dono log ek doosray ko izzat dein aur baat samajhne ki koshish karein, to ikhtilaf bhi seekhne ka zariya ban sakta hai.</p>

<p>Main bhi yahi seekhna chahta tha. Agar Zahra kabhi pareshan hoti, to main chahta tha ke main uski baat sunun. Agar usay kisi baat par khushi hoti, to main chahta tha ke main us khushi mein shareek hoon. Agar usay kuch waqt apne liye chahiye hota, to main uski zaroorat ka ehtiram karun.</p>

<p>Rishte ki khoobsurati mere liye isi mein thi ke hum ek doosray ke saath apni asli feelings ka izhaar kar saken. Har din perfect nahi hota. Kabhi thakan hoti hai, kabhi pareshani aur kabhi koi baat samajhne mein waqt lagta hai. Magar agar dono log baat karne aur ek doosray ko samajhne ke liye tayyar hon, to bohat si mushkilein aasaan ho sakti hain.</p>

<p>Mujhe us waqt nahi pata tha ke zindagi aage chal kar humein aise halaat bhi dikhayegi jahan sirf ek doosray ko samajhna kaafi nahi hoga. Kuch faislay hamare ikhtiyar se bahar bhi honge. Lekin us daur mein hamare paas ek doosray ko jaanne ka mauqa tha, aur main us mauqay ki qadar karta tha.</p>

<p>Shayad isi liye main Zahra se aur zyada qareeb mehsoos karne laga. Main usay sirf is liye pasand nahi karta tha ke woh mujhe khoobsurat lagti thi. Main uski baat karne ke andaaz, uski samajh aur us apnapan ko bhi pasand karta tha jo hamari guftagu mein dheere dheere paida ho raha tha.</p>

<p>Woh pehli nazar ab ek lambi kahani ka pehla safha ban chuki thi. Aur kahani ka agla hissa humein screen se nikal kar ek aisi mulaqat ki taraf le ja raha tha jo meri yaadon mein hamesha ke liye mehfooz rehni thi.</p>
`
},

{
title: "Jinnah Park Ka Khayal",
label: "Baab 18 · Mulaqat Ka Intezaar",
body: `
<p>Jab do log ek doosray se baat karte karte qareeb aa jaate hain, to ek waqt aisa bhi aata hai jab woh saamne baith kar guftagu karna chahte hain. Messages apni jagah achhe hotay hain, lekin saamne baith kar baat karne ka tajurba mukhtalif hota hai. Aap doosray ke alfaaz ke saath uske chehre ke expressions bhi dekhte hain, uski hansi sunte hain aur uski baat ka jawab foran de sakte hain.</p>

<p>Hamari kahani mein bhi woh waqt aaya jab humein ek doosray se saamne milne ka mauqa mila. Meri yaadon mein is mulaqat ki tareekh 13 August 2024 ke naam se mehfooz hai. Jagah Jinnah Park thi. Aaj bhi jab main is tareekh ko yaad karta hoon, to mere zehan mein hamari kahani ka woh hissa khulne lagta hai jo messages ki duniya se nikal kar ek haqeeqi mulaqat mein badal gaya tha.</p>

<p>Us mulaqat se pehle mere zehan mein kai khayalat thay. Main sochta tha ke saamne baith kar hamari baat kis tarah chalegi. Kya hum messages ki tarah aasani se guftagu kar payenge? Kya waqt jaldi guzar jayega? Kya koi aisi baat hogi jo baad mein humein hansaye gi?</p>

<p>In sawalon ka jawab sirf mulaqat ke waqt mil sakta tha. Main nahi chahta tha ke main har cheez ko pehle se soch kar us lamhe ko mushkil bana doon. Main bas chahta tha ke hum milen, baat karein aur ek doosray ko saamne baith kar samajhne ka mauqa dein.</p>

<p>Yeh mulaqat mere liye is liye bhi khaas thi ke hamari pehchaan ka aaghaz ek nazar se hua tha aur phir guftagu ke zariye hum ek doosray ko jaanne lage thay. Ab hum saamne baithne wale thay. Jo chehra pehli baar bazaar ki bheer mein nazar aaya tha, ab usay ek baar phir dekhne ka waqt aa raha tha.</p>

<p>Mujhe nahi pata tha ke is mulaqat ka har chhota waqia aane wale waqt mein kitni baar yaad aayega. Us waqt main bas us din ke aane ka intezar kar raha tha. Mujhe lagta tha ke yeh hamari kahani ka ek khoobsurat naya safha hoga.</p>

<p>Jinnah Park ka naam ab meri kahani mein shamil hone wala tha. Aur us din ke saath ek aisi yaad judne wali thi jo sirf jagah ya tareekh ki wajah se khaas nahi thi, balkay is liye bhi ke wahan main Zahra ke saamne baitha tha, us se baat kar raha tha aur usay apni aankhon ke saamne dekh raha tha.</p>

<div class="small-ornament">❦ ✧ ❦</div>

<p>Agla safha us mulaqat ka hoga: 13 August 2024, mera safed libas, Zahra ka siyah libas aur woh guftagu jismein waqt guzarta raha. Unhi lamhon mein ek mazaahiya sawal bhi tha jo aaj tak meri yaadon mein apni jagah rakhta hai.</p>
`
}
,
{
title: "Terah August Do Hazaar Chaubees",
label: "Baab 19 · Woh Din",
body: `
<p>Kuch tareekhein calendar par sirf numbers hoti hain, magar zindagi mein unka matlab bohat gehra ho jata hai. Mere liye 13 August 2024 bhi aisi hi ek tareekh thi. Yeh woh din tha jab main aur Zahra Jinnah Park mein milne wale thay. Hamari kahani ka aaghaz Eid ki shopping mein ek nazar se hua tha, phir Snapchat par guftagu shuru hui, aur ab woh waqt aa gaya tha jab hum ek doosray ke saamne baith kar baat kar sakte thay.</p>

<p>Main ne shayad us din ke baare mein bohat kuch socha hoga. Insaan jab kisi khaas shakhs se milne ja raha hota hai to zehan mein kai sawal aate hain. Mulaqat kaisi hogi? Baat kahan se shuru hogi? Kya woh bhi utni hi khush hogi? Kya waqt hamari umeed ke mutabiq guzrega? Lekin asal lamha jab saamne aata hai, to aksar saari sochi hui baatein peeche reh jaati hain.</p>

<p>Mujhe yaad hai ke main ne safed libas pehna tha aur Zahra siyah libas mein thi. Aaj bhi jab main us din ko apne zehan mein dobara dekhta hoon, to in dono rangon ka zikr meri yaadon mein aa jata hai. Safed aur siyah—do mukhtalif rang, lekin us din ki ek hi tasveer mein shamil.</p>

<p>Jinnah Park ki woh mulaqat mere liye sirf ek date nahi thi. Yeh us safar ka ek aham mor tha jo ek anjaan chehre ko pehchanne se shuru hua tha. Main us larki ke saamne baithne wala tha jiska naam jaanne ke liye main ne apni behan se baat ki thi, jis se Snapchat par pehla message kiya tha aur jis ke saath guftagu karte karte main apne dil ki baat kehne ki himmat kar paya tha.</p>

<p>Jab main us din ko yaad karta hoon, to mujhe lagta hai ke kuch lamhon ki qeemat us waqt samajh nahi aati. Us waqt woh bas ek khoobsurat din lagta hai. Baad mein jab zindagi badal jaati hai, tab insaan samajhta hai ke us din ki saadgi bhi kitni qeemti thi.</p>

<p>Us mulaqat ka har lamha mujhe aaj bhi is liye yaad hai kyun ke us mein banawat se zyada apnapan tha. Hum milay, baithay aur baatein karte rahe. Humein shayad us waqt andaza bhi nahi tha ke ek din yahi yaad meri kahani ka itna bara hissa ban jayegi.</p>

<div class="dialogue">13 August 2024 — woh din jab ek mulaqat meri zindagi ki sab se qeemti yaadon mein shamil ho gayi.</div>

<p>Kaash waqt ko usi jagah rok dena mumkin hota. Magar waqt ka apna safar hota hai. Woh kisi ke kehne par nahi rukta. Woh lamhon ko yaadon mein badalta hua aage barhta rehta hai, aur insaan un yaadon ko apne dil mein sambhal kar rakhta hai.</p>
`
},

{
title: "Siyah Libas Aur Safed Yaad",
label: "Baab 20 · Do Rang",
body: `
<p>Zahra ka siyah libas aur mera safed libas—yeh dono baatein us din ki tasveer ka hissa ban gayin. Ho sakta hai kisi aur ke liye yeh bas kapron ke rang hon, lekin mere liye yeh us mulaqat ki pehchan ban gaye. Jab bhi main 13 August 2024 ka sochta hoon, to meri yaad unhi manazir ki taraf laut jaati hai.</p>

<p>Us din ki ahmiyat is baat mein nahi thi ke hum ne kya pehna tha. Asal baat yeh thi ke hum dono ek doosray ke saamne maujood thay. Ab guftagu sirf screen par likhe alfaaz tak mehdood nahi thi. Hum ek doosray ki baat saamne baith kar sun sakte thay. Hansi ka jawab hansi se de sakte thay aur kisi jumlay ke baad aane wali khamoshi ko bhi mehsoos kar sakte thay.</p>

<p>Main ne pehle Zahra ko door se dekha tha. Us waqt mujhe uski halki bhoori aankhein yaad reh gayi thin. Phir uska naam maloom hua, us se baat shuru hui aur waqt ke saath uski shakhsiyat ke doosray pehlu bhi saamne aane lage. Ab jab woh mere saamne thi, to mere liye yeh sirf uski aankhon ko dobara dekhna nahi tha. Yeh us insaan se milna tha jiske saath main apni roz ki baatein share karne laga tha.</p>

<p>Hum baatein karte rahe. Kabhi ek baat se doosri baat nikalti, kabhi kisi waqia ka zikr hota aur kabhi guftagu apne hi raaste par chalti rehti. Mujhe yeh achha lag raha tha ke humein ek doosray ke saath waqt guzarne ke liye har baar kisi khaas topic ki zaroorat nahi thi.</p>

<p>Mohabbat mein kabhi kabhi sab se khoobsurat cheez yeh hoti hai ke aap kisi ke saath baith kar waqt guzar sakte hain aur aapko har lamhe ko khaas banane ki koshish nahi karni parti. Doosray ki mojoodgi hi us waqt ko yaadgar bana deti hai.</p>

<p>Mujhe us din yeh bhi mehsoos hua ke online guftagu aur saamne baith kar baat karne mein farq hota hai. Messages mein aap soch kar jawab likh sakte hain, lekin saamne baith kar aap doosray ke expressions, uski hansi aur uske bolne ke andaaz ko bhi dekhte hain. Yeh sab cheezein ek doosray ko samajhne mein apna hissa daalti hain.</p>

<p>Woh din kisi film ke manzar jaisa banawati nahi tha. Woh hamari zindagi ka ek saada sa din tha, jismein hum dono ne waqt guzara aur apni kahani ki ek nayi yaad bana li. Shayad isi saadgi ki wajah se woh yaad mere liye itni qeemti hai.</p>

<p>Aaj main jab us din ko yaad karta hoon, to mujhe lagta hai ke rang kapron ke thay, magar un rangon se judi yaad dil mein reh gayi. Siyah libas aur safed libas us mulaqat ki chhoti si nishani ban gaye.</p>
`
},

{
title: "Chalees Minute Aur Umar Ka Sawal",
label: "Baab 21 · Woh Mazaahiya Lamha",
body: `
<p>Jinnah Park ki us mulaqat mein hum ne bohat si baatein ki thin. Guftagu itni der tak chalti rahi ke waqt ka andaza hi nahi raha. Jab aap kisi ke saath khul kar baat kar rahe hon, to kabhi kabhi ghari ki taraf dekhna bhi yaad nahi rehta. Aap ek baat ka jawab dete hain, phir doosri baat shuru ho jaati hai, aur isi tarah waqt apna safar karta rehta hai.</p>

<p>Us din ka ek mazaahiya waqia meri yaadon mein khaas jagah rakhta hai. Zahra lagataar baat karti rahi aur main uski baatein sunta raha. Mere liye uski guftagu sunna koi bojh nahi tha. Main usay sunna chahta tha. Uski baaton ke darmiyan waqt guzarta raha aur humein ehsaas hi nahi hua ke kitni der ho chuki hai.</p>

<p>Phir jab jaane ka waqt qareeb aaya, Zahra ne ek aisa jumla kaha jo baad mein meri yaadon ka hissa ban gaya.</p>

<div class="dialogue">“Oh, maaf kijiyega, main aapse poochna hi bhool gayi, aapki umar kya hai?”</div>

<p>Main ne uski baat suni aur muskuraye baghair na reh saka. Hum itni der se baat kar rahe thay, itne saare topics par guftagu ho chuki thi, lekin usay meri umar poochna yaad hi nahi raha tha.</p>

<div class="dialogue">“40 minutes.”</div>

<p>Mera jawab chhota sa tha, magar us mein us lamhe ka saara mazaahiya pehlu chhupa tha. Chalees minute tak woh baat karti rahi thi aur main sunta raha tha. Aakhir mein umar ka sawal aaya, to main ne waqt hi ko apna jawab bana diya.</p>

<p>Yeh un lamhon mein se tha jinhein yaad karte hue baad mein bhi chehre par muskurahat aa jaati hai. Kabhi kabhi kisi rishte ki yaadein bari bari baaton se nahi, balkay aise chhote waqiat se banti hain. Ek jumla, ek jawab aur us waqt ka mahaul—yeh sab mil kar ek aisi yaad bana dete hain jo waqt guzarne ke baad bhi zinda rehti hai.</p>

<p>Mujhe us waqia mein yeh baat bhi achhi lagti hai ke hum apni guftagu mein itne mashghool thay ke ek zaroori sawal peeche reh gaya. Hamari mulaqat mein sirf sanjeeda baatein nahi thin. Us mein hansi bhi thi, mazaaq bhi tha aur woh saadgi bhi thi jo do logon ke darmiyan apnapan barhne par paida hoti hai.</p>

<p>Jab main aaj us jumlay ko dobara parhta hoon, to mujhe lagta hai ke us din ki sab se khoobsurat baat shayad yahi thi: humein ek doosray ke saath waqt guzarna achha lag raha tha. Ghari chalti rahi, baatein hoti rahin aur chalees minute ek aisi yaad ban gaye jise main apni kahani mein hamesha sambhal kar rakhna chahta hoon.</p>

<div class="small-ornament">❦ ✧ ❦</div>

<p>Kuch lamhay khatam ho jaate hain, lekin unka mazaahiya pehlu kabhi khatam nahi hota. Woh ek baar guzarte hain aur phir yaadon mein baar baar dohraye jaate hain.</p>
`
},

{
title: "Main Sunta Raha",
label: "Baab 22 · Uski Baatein",
body: `
<p>Us mulaqat ki ek aur baat mujhe yaad rehti hai: main Zahra ko sunta raha. Aksar log kisi guftagu mein apni baat kehne ka intezar karte hain. Magar us din mere liye uski baat sunna bhi apni jagah ek khushi thi. Main uski guftagu mein dilchaspi leta tha aur chahta tha ke woh apni baat araam se keh sake.</p>

<p>Kisi ko sunna sirf khamosh rehne ka naam nahi. Is ka matlab hai ke aap uski baat par tawajjo dein, uske alfaaz ko samajhne ki koshish karein aur usay yeh mehsoos karayein ke uski baat aapke liye ahmiyat rakhti hai. Main yeh nahi keh sakta ke main har waqt har baat ko bilkul theek samajhta tha, lekin main usay samajhne ki koshish zaroor karna chahta tha.</p>

<p>Zahra baat karti thi aur main sunta tha. Kabhi koi naya waqia hota, kabhi koi mamooli si baat aur kabhi guftagu kisi aise rukh par chali jaati jiska humein pehle se andaza nahi hota tha. Aisi baatein hi mulaqat ko apna rang deti hain.</p>

<p>Chalees minute ka woh waqia mere liye is liye bhi yaadgar hai ke us mein hamari guftagu ka andaaz nazar aata hai. Aakhir mein jab usay meri umar poochna yaad aaya, to mujhe waqt ka zikr kar ke jawab dena achha laga. Woh ek chhota sa mazaaq tha, lekin uske peeche ek seedhi si baat thi: main uski baatein sunte hue waqt ka hisaab bhool gaya tha.</p>

<p>Har rishte mein dono logon ko bolne aur sunne ka mauqa milna chahiye. Sirf ek shakhs ki baat chalti rahe aur doosray ko apni baat kehne ka mauqa na mile, to guftagu adhoori reh jaati hai. Mere liye us din ki yaad ka matlab yeh nahi ke main hamesha sirf sunta hi raha. Is ka matlab yeh hai ke us lamhe mein main uski baaton ko tawajjo dena chahta tha.</p>

<p>Waqt guzarne ke saath insaan ko samajh aata hai ke yaadon ki qeemat unki lambai se nahi hoti. Kabhi kuch minute bohat gehra asar chhor jaate hain, aur kabhi poora din guzar kar bhi koi ek waqia yaad nahi rehta. Jinnah Park ka woh waqt meri yaadon mein is liye mehfooz hai kyun ke us mein hamari apni kahani thi.</p>

<p>Main nahi jaanta tha ke ek din main inhi baaton ko likh kar apne guzre hue waqt ko dobara samajhne ki koshish karunga. Us waqt main bas Zahra ke saath tha. Hum baat kar rahe thay aur mujhe lag raha tha ke yeh waqt hamara hai.</p>

<p>Shayad isi liye aaj bhi us din ko yaad karte hue mujhe sirf ek park ya do rang yaad nahi aate. Mujhe woh guftagu yaad aati hai, uska umar poochna yaad aata hai aur mera “40 minutes” kehna yaad aata hai.</p>
`
},

{
title: "Waqt Jaldi Guzar Gaya",
label: "Baab 23 · Ruk Jaane Wali Yaad",
body: `
<p>Jinnah Park ki mulaqat ka waqt apne anjaam ki taraf barh raha tha. Jab hum kisi khaas lamhe mein khush hotay hain, to dil chahta hai ke woh lamha thora aur lamba ho jaye. Aap sochte hain ke abhi ek baat aur karni hai, ek sawal aur poochna hai, ya bas kuch der aur wahin baithna hai. Lekin waqt apni raftaar se guzarta rehta hai.</p>

<p>Us din bhi baatein hoti rahin aur waqt guzarta raha. Mulaqat ke shuru mein jo lamha aane wala tha, woh ab yaad banne ke qareeb tha. Main nahi chahta tha ke din foran khatam ho jaye, lekin mujhe pata tha ke har mulaqat ka ek waqt hota hai.</p>

<p>Jab hum kisi se mil kar wapas jaate hain, to aksar zehan mein us mulaqat ke chhote chhote hisse dobara chalne lagte hain. Kis baat par hansi aayi, kis sawal ka kya jawab diya, kis waqt kya kaha—yeh sab cheezein raaste mein ya ghar pahunch kar yaad aati rehti hain. Mere liye bhi us din ke baad yahi hua.</p>

<p>Safed libas, Zahra ka siyah libas, uski baatein aur chalees minute wala mazaahiya sawal—yeh sab mere zehan mein ek saath jama hone lage. Main ne shayad us waqt yeh nahi socha tha ke yeh yaad itni der tak mere saath rahegi. Us waqt yeh bas hamari pehli khaas mulaqat thi.</p>

<p>Is mulaqat ne hamare rishte ko ek naya pehlu diya. Ab hamare paas sirf messages ki yaadein nahi thin, balkay saamne baith kar guftagu karne ka tajurba bhi tha. Hum ek doosray ko aur achhi tarah samajhne ke liye ek aur qadam aage barh chuke thay.</p>

<p>Main jaanta tha ke ek mulaqat se kisi insaan ki poori shakhsiyat nahi samjhi ja sakti. Kisi ko jaanne ke liye waqt chahiye hota hai. Lekin us din ne mujhe yeh zaroor mehsoos karaya ke hamari kahani mein aur bhi bohat se safhay likhe ja sakte hain.</p>

<p>Kaash main us waqt apne aap ko bata sakta ke aage chal kar main is din ko kitni baar yaad karunga. Kaash mujhe pata hota ke zindagi ke kuch saada lamhay insaan ke andar itni gehri jagah bana lete hain. Lekin shayad agar humein har yaad ki mustaqbil ki qeemat pehle se maloom hoti, to hum unhein jeene ke bajaye unke khatam hone se darne lagte.</p>

<p>Is liye us din main ne bas us waqt ko jeene ki koshish ki. Hum milay, baat ki aur apni kahani mein ek naya safha shamil kar liya. Jab mulaqat khatam hui, to woh din guzar gaya, magar uski yaad mere saath reh gayi.</p>

<div class="dialogue">Kuch mulaqatein chand ghanton ki hoti hain, magar unki yaad insaan ke saath saalon tak chalti hai.</div>

<p>Jinnah Park ki woh mulaqat meri zindagi ka aisa hi ek safha thi. Aur ab hamari kahani mein aage woh din aane wale thay jab milna sirf ek khaas mauqa nahi, balkay hamari yaadon ka ek mamool banta chala gaya.</p>
`
},

{
title: "Mulaqat Se Baad Ki Yaad",
label: "Baab 24 · Ghar Laut Kar",
body: `
<p>Mulaqat ke baad jab insaan apni roz ki zindagi mein wapas aata hai, to uska zehan kabhi kabhi abhi bhi usi jagah par hota hai. Jism apne mamool ke kaam kar raha hota hai, lekin soch mein kuch der pehle guzra hua waqt chal raha hota hai. Mere liye Jinnah Park ki mulaqat bhi ek aisi yaad ban gayi thi.</p>

<p>Main us din ki baaton ko yaad karta. Kabhi Zahra ka siyah libas zehan mein aata, kabhi apne safed libas ka khayal, aur kabhi woh mazaahiya lamha jab usne aakhir mein meri umar poochi thi. Main ne usay chalees minute wala jawab diya tha, aur ab yeh waqia meri yaadon mein ek chhoti si muskurahat ban kar reh gaya tha.</p>

<p>Us mulaqat ki khoobsurati is mein thi ke humein ek doosray ke saath waqt guzarne ka mauqa mila. Hamari pehchaan ab ek nayi manzil par thi. Pehle main ne usay dekha tha, phir uska naam jaana, phir message kiya aur phir apne ehsaas ka izhaar kiya. Ab hamare paas saamne baith kar guftagu karne ki yaad bhi thi.</p>

<p>Main samajhne laga tha ke kisi rishte mein yaadein ek ek kar ke jama hoti hain. Koi ek mulaqat, koi ek jumla, koi ek mazaaq ya koi chhota sa waqia—yeh sab mil kar ek aisi duniya banate hain jiska matlab sirf un do logon ko samajh aata hai jo us mein shareek thay.</p>

<p>Jab main us din ko yaad karta hoon, to mujhe mehsoos hota hai ke main us waqt apni zindagi ke ek naye daur mein tha. Main Zahra ko pasand karta tha aur usay samajhne ki koshish kar raha tha. Mujhe uski baaton ka intezar rehta tha aur ab us se milne ki yaad bhi mere paas thi.</p>

<p>Is ka matlab yeh nahi tha ke ab hamare darmiyan koi mushkil aa hi nahi sakti thi. Zindagi kisi bhi rishte ko sirf khushiyon ke din nahi deti. Lekin us waqt main yeh soch kar pareshan nahi hota tha. Main chahta tha ke hum apni guftagu ko jaari rakhein, ek doosray ki izzat karein aur apne rishte ko samajhdari se aage barhayein.</p>

<p>Jab bhi mujhe us mulaqat ka khayal aata, mujhe lagta ke hamari kahani ka aaghaz kitna anokha tha. Ek nazar se shuru hone wala safar ab ek aisi yaad tak aa pahuncha tha jise main apni zindagi se alag nahi kar sakta tha.</p>

<p>Yeh safha yahin khatam hota hai, magar kahani nahi. Jinnah Park ki mulaqat hamare rishte ka ek yaadgar hissa thi. Is ke baad bhi hum milay, baat karte rahe aur ek doosray ki zindagi mein apni jagah banate rahe.</p>
`
}
,
{
title: "Mulaqatein Jo Yaadein Ban Gayin",
label: "Baab 25 · Saath Guzarta Waqt",
body: `
<p>Jinnah Park ki woh mulaqat hamari kahani ka aakhri khoobsurat din nahi thi. Woh to bas ek aisa safha tha jis ke baad hamare paas ek doosray se judi aur bhi yaadein jama hone lagin. Hum sirf messages aur calls tak mehdood nahi rahe. Hum aksar saamne bhi milte thay, baatein karte thay aur apne waqt ko apne andaaz mein guzarte thay.</p>

<p>Har mulaqat ka apna rang hota tha. Kabhi hum bohat si baatein karte, kabhi kisi mamooli si baat par hans dete aur kabhi bas ek doosray ke saath baithna hi kaafi lagta. Mujhe dheere dheere samajh aane laga tha ke kisi ke saath apnapan mehsoos karne ke liye har baar kisi khaas jagah ya khaas plan ki zaroorat nahi hoti. Kabhi saath guzara hua saada sa waqt bhi dil mein apni jagah bana leta hai.</p>

<p>Zahra ke saath meri mulaqatein mere liye is liye khaas thin kyun ke un mein main us shakhs ko aur achhi tarah jaan raha tha jise main pasand karta tha. Uski baaton ka andaaz, uska kisi baat par hans dena, kisi cheez ko lekar uska apna nazariya—yeh sab cheezein meri yaadon ka hissa banti chali gayin.</p>

<p>Kabhi kabhi hum kisi insaan ko pehli nazar mein pasand kar lete hain, magar us se mohabbat ka safar us waqt shuru hota hai jab hum uski aadaton aur mizaj ko samajhne lagte hain. Mere liye bhi aisa hi tha. Pehli mulaqat mein uski aankhein yaad reh gayi thin, lekin waqt ke saath uski baatein aur uska andaaz bhi utna hi aham hota gaya.</p>

<p>Main chahta tha ke woh mere saath khul kar baat kare. Agar uska mood achha hota to hum mazaaq karte, aur agar woh khamosh hoti to main uski khamoshi ko bhi samajhne ki koshish karta. Har din ek jaisa nahi hota. Kabhi insaan ke paas kehne ko bohat kuch hota hai aur kabhi woh bas chahta hai ke koi uski baat sun le.</p>

<p>Hamari mulaqatein waqt ke saath meri zindagi ke mamool ka hissa banne lagin. Main unhein sirf calendar par likhe hue din nahi samajhta tha. Woh aise lamhay thay jin mein main apni zindagi ka ek hissa Zahra ke saath share karta tha.</p>

<p>Aaj jab main guzre hue waqt ko yaad karta hoon, to samajh aata hai ke yaadein us waqt banti hain jab humein unke yaad banne ka ehsaas bhi nahi hota. Hum bas jee rahe hote hain, baatein kar rahe hote hain aur apne din guzar rahe hote hain. Phir ek waqt aata hai jab wohi mamooli se din bohat khaas lagne lagte hain.</p>

<div class="dialogue">Us waqt humein nahi pata tha ke hum yaadein bana rahe hain. Hum to bas ek doosray ke saath waqt guzar rahe thay.</div>
`
},

{
title: "Meri Mah Girlee",
label: "Baab 26 · Uska Naam Mere Andaaz Mein",
body: `
<p>Zahra ko bulane ke mere apne hi andaaz thay. Uske liye mere paas sirf ek naam nahi tha. Kabhi main usay “Meri Mah Girlee” kehta, kabhi “Meri Tamatar Girlee” aur kabhi “Meri Choti Si Guriya”. Yeh nicknames sunne mein chhote se alfaaz thay, lekin hamari guftagu mein inka apna hi maza tha.</p>

<p>“Meri Mah Girlee 🎀” kehte hue mujhe ek apnapan mehsoos hota tha. “Meri Tamatar Girlee 🍅😭” mein shararat thi, aur “Meri Choti Si Guriya 🥹🧸” mein ek narmi si thi. Har nickname ka apna andaaz tha. Kabhi ek naam munh par aa jata, kabhi doosra, aur kabhi main khud hi naye naye naam bana leta.</p>

<p>Mujhe achha lagta tha ke Zahra ko mere yeh naam pasand thay. Jab main usay kisi pyare se nickname se bulata, to uska sharmana aur uska reaction mere liye ek chhoti si khushi ban jata. Mohabbat mein kuch baatein sirf do logon ke darmiyan samajh aati hain. Doosron ke liye woh mamooli alfaaz ho sakte hain, magar un do logon ke liye un mein apni kahani chhupi hoti hai.</p>

<p>“Meri Golu Molu Tamatar 🍅😭”, “Meri Nanhi Si Pari 🧚🏻‍♀️💗”, “Meri Cutieee Si Baby 🫠🎀” aur “Meri Shonaaa 🥹💗”—yeh sab us chhoti si duniya ka hissa thay jo hamari guftagu mein banti thi. Kabhi koi naam kisi mazaaq ke baad aata, kabhi kisi pyari si baat ke saath aur kabhi bas yunhi.</p>

<p>Un nicknames ka matlab sirf kisi ko pyara kehna nahi tha. Un mein hamare darmiyan guzre hue waqt ki apni pehchan thi. Jab koi shakhs aapki zindagi mein khaas jagah bana leta hai, to usay bulane ka andaaz bhi aam nahi rehta. Aap uske liye aise alfaaz chun lete hain jo aapki apni guftagu ka hissa ban jaate hain.</p>

<p>Mujhe yaad hai ke main usay kabhi “Meri Laal Si Tamatar 🍅❤️” kehta aur kabhi “Meri Ladoo Si Guriya 🍡🎀”. Yeh naam kisi kitaab se nahi aaye thay. Yeh hamari apni baaton aur hamare apne andaaz se nikle thay. Shayad isi liye mujhe yeh sab yaad rehta hai.</p>

<p>Aaj jab main un nicknames ko yaad karta hoon, to mere zehan mein sirf alfaaz nahi aate. Mujhe woh waqt yaad aata hai jab in naamon par uska reaction dekhna achha lagta tha. Mujhe hamari woh chhoti chhoti baatein yaad aati hain jo kisi aur ko samjhana mushkil ho sakta hai, magar mere liye hamari kahani ka bohat pyara hissa hain.</p>

<div class="dialogue">Kuch naam sirf bulane ke liye nahi hote; woh kisi ke saath judi hui yaadon ki pehchan ban jaate hain.</div>

<p>Zahra mere liye sirf ek naam nahi thi. Us naam ke saath meri pehli nazar, Snapchat ka pehla paighaam, Jinnah Park ki mulaqat aur woh saare nicknames judte chale gaye jo main usay pyar se kaha karta tha.</p>
`
},

{
title: "Uski Hansi Ka Asar",
label: "Baab 27 · Chhoti Si Khushi",
body: `
<p>Zahra ki hansi bhi un cheezon mein se thi jo mere liye hamare rishte ko khaas banati thin. Kabhi koi mazaahiya baat ho jaati, kabhi main usay kisi nickname se bula deta aur kabhi hamari guftagu apne hi andaaz mein chalti rehti. Aise lamhon mein uska hansna mere liye ek chhoti si khushi hota tha.</p>

<p>Mohabbat ka matlab hamesha bari bari baatein kehna nahi hota. Kabhi kisi ko hansana, uska mood halka karna aur usay yeh mehsoos karana ke woh aapke saath apni asli shakhsiyat ke saath reh sakta hai, yeh sab bhi apnapan paida karte hain. Main chahta tha ke Zahra mere saath apni khushi bhi share kare aur jab uska dil udaas ho to apni pareshani bhi keh sake.</p>

<p>Har baar main usay hansane mein kamyab hota hoon, aisa nahi tha. Na hi har udaasi ka hal mere paas hota tha. Lekin main uski baat sunna aur uska saath dena chahta tha. Kabhi kabhi insaan ko mashwara dene se pehle uski baat samajhna zaroori hota hai. Main bhi waqt ke saath yahi seekh raha tha.</p>

<p>Uski hansi se judi yaadein is liye qeemti hain kyun ke woh hamare rozmarrah ke lamhon ka hissa thin. Un mein koi khaas tayyari nahi hoti thi. Bas hum baat karte aur kabhi kisi baat par hansi aa jaati. Aise lamhon mein mujhe mehsoos hota ke hamare darmiyan ek apna sa andaaz ban raha hai.</p>

<p>Jab main pehli baar usay dekha tha, to meri tawajjo uski halki bhoori aankhon par ruk gayi thi. Main nahi jaanta tha ke us pehli nazar ke baad main uski hansi, uske nicknames par reactions aur uske bolne ke andaaz ko bhi itni ahmiyat dene lagunga.</p>

<p>Yahi to waqt ka kamaal hai. Pehle hum kisi shakhs ki ek baat notice karte hain, phir uski doosri baat, aur phir dheere dheere uski bohat si chhoti chhoti aadatein hamari yaadon ka hissa ban jaati hain. Ek din humein ehsaas hota hai ke hum sirf uski khoobsurat aankhon ko nahi, balkay uske saath guzare hue waqt ko bhi yaad karte hain.</p>

<p>Mere liye Zahra ki hansi bhi aisi hi ek yaad thi. Main usay kisi ek jumlay mein bayan nahi kar sakta, kyun ke woh kisi ek waqia tak mehdood nahi thi. Woh hamari guftagu ke mukhtalif lamhon mein bikhri hui thi.</p>

<p>Shayad isi liye kuch yaadein likhte hue insaan ko lagta hai ke alfaaz kam par rahe hain. Waqia likha ja sakta hai, us mein kahe gaye jumlay likhe ja sakte hain, magar us waqt dil mein jo khushi mehsoos hui thi, usay poori tarah alfaaz mein sametna mushkil hota hai.</p>

<p>Yeh baab bhi usi hansi aur unhi chhoti khushiyon ke naam hai. Un lamhon ke naam jo us waqt mamooli lagte thay, magar aaj meri kahani mein apni jagah rakhte hain.</p>
`
},

{
title: "Aadat Ka Safar",
label: "Baab 28 · Roz Ka Hissa",
body: `
<p>Waqt guzarta gaya aur Zahra meri zindagi ke mamool ka hissa banti gayi. Pehle uska naam jaanne ki khwahish thi. Phir us se baat karne ka intezar shuru hua. Uske baad hum ne ek doosray ki pasand aur na-pasand ko samajhna shuru kiya, aur phir mulaqatein bhi hamari kahani ka hissa ban gayin.</p>

<p>Kisi shakhs ki aadat banne ka safar aksar bohat aahista hota hai. Pehle aap us se baat karne ka mauqa dhoondte hain. Phir uska paighaam aapke din ka ek aham hissa ban jata hai. Dheere dheere aap apni chhoti chhoti baatein bhi usay batane lagte hain. Aapko lagta hai ke din mein koi baat hui hai to usay batana achha lagega, aur koi khushi mili hai to uske saath share karna chahiye.</p>

<p>Mere saath bhi yahi hua. Zahra se baat karna meri roz ki zindagi ka hissa ban gaya. Uske saath guftagu sirf waqt guzarna nahi thi. Main usay apni baatein batata aur uski baatein sunta. Kabhi hum hans dete, kabhi kisi baat par sanjeeda ho jaate aur kabhi bas ek doosray ko samajhne ki koshish karte.</p>

<p>Us waqt mujhe shayad poori tarah andaza nahi tha ke aadat kitni gehri ho sakti hai. Jab koi shakhs aapke din ka mamool ban jaye, to uski mojoodgi aapko aam lagne lagti hai. Aap sochte hain ke kal bhi baat hogi, aglay din bhi koi naya waqia share hoga aur waqt isi tarah guzarta rahega.</p>

<p>Lekin zindagi har cheez ki guarantee nahi deti. Yeh baat insaan ko aksar baad mein samajh aati hai. Us waqt main sirf apne rishte ko jee raha tha. Main chahta tha ke hum ek doosray ko samajhte rahen aur hamare darmiyan baat cheet ka silsila jaari rahe.</p>

<p>Aaj jab main peeche mur kar dekhta hoon, to mujhe apni woh baat yaad aati hai: <em>“Zahra ki aadat thi mujhe, aur aadat mohabbat se zyada khatarnak hoti hai.”</em> Is jumlay mein mere liye us waqt ki gehrai chhupi hai. Mohabbat ka izhaar alfaaz mein kiya ja sakta hai, magar aadat insaan ke roz ke mamool mein utar jaati hai.</p>

<p>Aadat ka matlab yeh nahi ke kisi ko apni zindagi ka wahid sahara bana diya jaye. Is ka matlab yeh hai ke kisi ke saath guzara hua waqt aapke din ka ek pehchana hua hissa ban jata hai. Jab woh hissa badalta hai, to us tabdeeli ko samajhne aur qabool karne mein waqt lag sakta hai.</p>

<p>Us waqt hamare paas abhi bohat si yaadein banani baqi thin. Humein nahi pata tha ke aage chal kar zindagi hamare saamne kya le kar aayegi. Hum apni kahani ke us daur mein thay jahan mulaqatein, nicknames aur guftagu hamare dinon ko apna rang de rahe thay.</p>

<div class="dialogue">Kuch log hamari zindagi mein aate hain, aur phir unse baat karna zindagi ke mamool ka hissa ban jata hai.</div>

<p>Yeh safar abhi jaari tha. Aur aage isi kahani mein woh lamha bhi aana tha jab ek chhoti si baat hamare darmiyan pehli narazgi ka sabab bani—ek aisi narazgi jiske baad humein samajhna tha ke kisi ko pasand karna aur uske faislon ki izzat karna, dono ek saath seekhne parte hain.</p>
`
}

,
{
title: "Pehli Narazgi",
label: "Baab 29 · Ek Naya Ehsaas",
body: `
<p>Har kahani mein sirf khushiyon ke lamhay nahi hote. Kuch aise din bhi aate hain jab do log ek doosray ko pasand karte hue bhi kisi baat par ek jaisi soch nahi rakhte. Hamari kahani mein bhi ek aisa waqt aaya jab ek mamooli si baat ne hamare darmiyan narazgi paida kar di.</p>

<p>Zahra ne mujhe bataya ke woh ek shaadi mein jaana chahti hai. Mere dil mein us waqt uske liye fikr aur apnapan dono thay, lekin main nahi chahta tha ke woh wahan jaye. Main apni baat par qaim tha aur shayad us waqt main yeh poori tarah nahi samajh pa raha tha ke meri soch aur uski apni marzi do alag cheezein hain.</p>

<p>Jab aap kisi ko bohat pasand karte hain, to kabhi kabhi aap apni fikr ko itna aham samajhne lagte hain ke doosray shakhs ka nazariya samajhna mushkil ho jata hai. Aapko lagta hai ke jo aap soch rahe hain, wahi behtar hai. Magar kisi rishte mein sirf apni baat samjhana kaafi nahi hota; doosray ki baat sunna bhi zaroori hota hai.</p>

<p>Us waqt hamare darmiyan bhi baat barh gayi. Jo guftagu aam dinon mein asaani se chalti thi, woh ab kuch bhaari si mehsoos hone lagi. Main apni jagah apni baat soch raha tha aur Zahra apni jagah apni khwahish ko samjhana chahti thi.</p>

<p>Mujhe us waqt shayad yeh ehsaas nahi tha ke kabhi kabhi mohabbat karne ke bawajood hum apni baat kehne ka tareeqa ghalat chun lete hain. Dil mein kisi ke liye fikr hona aur uski marzi ka ehtram karna ek doosray ke khilaaf nahi hain. Dono cheezein saath chal sakti hain, bas unhein samajhne ke liye sabr chahiye.</p>

<p>Woh hamari pehli narazgiyon mein se ek thi jis ne mujhe yeh dikhaya ke rishte mein sirf achhe lamhay hi nahi, mushkil guftagu bhi aati hai. Agar do log ek doosray ko samajhna chahte hon, to unhein apne ehsaas ke saath doosray ke ehsaas ko bhi jagah deni parti hai.</p>

<p>Main yeh nahi keh sakta ke us din hum dono ne har baat bilkul theek samjhi thi. Hum apne rishte ko seekh rahe thay. Hum dono ko abhi yeh samajhna tha ke ikhtilaf hone ka matlab yeh nahi ke apnapan khatam ho gaya hai.</p>

<div class="dialogue">Kabhi kabhi pehli narazgi humein yeh sikhati hai ke mohabbat sirf apni baat manwane ka naam nahi, balkay ek doosray ko samajhne ka naam bhi hai.</div>

<p>Yeh waqia hamari kahani mein ek chhota sa mor tha. Is ke baad humein apni baat cheet dobara usi narmi ki taraf le kar jaani thi jo hamare rishte ki pehchan ban rahi thi.</p>
`
},

{
title: "Meri Fikr Aur Uski Marzi",
label: "Baab 30 · Samajhne Ka Lamha",
body: `
<p>Narazgi ke baad jab main ne us baat ko dobara socha, to mujhe mehsoos hua ke mere dil mein jo kuch tha, usay samajhne aur samjhane ka tareeqa bhi utna hi zaroori tha. Main Zahra ke liye fikr mehsoos karta tha, lekin har fikr ka izhaar is tarah nahi hona chahiye ke doosray shakhs ko lage uski apni marzi ki koi ahmiyat hi nahi.</p>

<p>Mohabbat mein insaan kabhi kabhi kisi ko kho dene ke khayal se bhi pareshan ho jata hai. Woh chahta hai ke sab kuch uski soch ke mutabiq chale, kyun ke usay lagta hai ke is tarah woh apne rishte ko mehfooz rakh sakega. Lekin asal mein kisi rishte ko mazboot banane ke liye bharosa, izzat aur khuli guftagu ki zaroorat hoti hai.</p>

<p>Main us waqt apne ehsaas ko samajhne ki koshish kar raha tha. Mujhe Zahra se baat karna achha lagta tha, uske saath waqt guzarna achha lagta tha aur main chahta tha ke hamare darmiyan sab kuch theek rahe. Magar har baat ka theek rehna is baat par munhasir nahi hota ke dono hamesha ek hi faisla karein.</p>

<p>Do log ek doosray se mohabbat kar sakte hain aur phir bhi kisi baat par mukhtalif rai rakh sakte hain. Zaroori yeh hota hai ke woh ikhtilaf ke waqt ek doosray ki izzat kam na karein. Apni baat kehna haq hai, magar doosray ki baat sunna bhi rishte ki zimmedari hai.</p>

<p>Us din ki narazgi ko yaad karte hue main apne aap ko bhi samajhne ki koshish karta hoon. Main us kahani ka kirdar tha jo Zahra se bohat lagao rakhta tha, lekin mujhe bhi seekhna tha ke lagao ko kaise zahir karna hai. Har insaan apne tajurbon se kuch na kuch seekhta hai, aur rishte bhi humein apne rawaiye par ghaur karna sikhate hain.</p>

<p>Hamare darmiyan jo kuch hua, uska matlab yeh nahi tha ke hamari saari khushiyan jhooti thin ya hamara apnapan khatam ho gaya tha. Bas ek baat par hamari soch mukhtalif thi. Us ikhtilaf ko samajhne mein waqt laga, magar waqt ke saath narazgi kam hone lagi.</p>

<p>Mere liye yeh baab is liye aham hai kyun ke is mein kahani sirf Zahra ke baare mein nahi, balkay mere apne seekhne ke safar ke baare mein bhi hai. Kisi ko chahna ek ehsaas hai, lekin uske saath behtar tareeqe se pesh aana ek aisi cheez hai jo insaan ko seekhni parti hai.</p>

<p>Jab main aaj us waqia ko dekhta hoon, to mujhe lagta hai ke rishte ko samajhne ke liye sirf khoobsurat yaadon ko yaad karna kaafi nahi. Humein apni ghaltiyon aur un lamhon ko bhi samajhna chahiye jahan hum behtar rawaiya apna sakte thay.</p>

<p>Yahi samajh aage chal kar hamare rishte ke liye bhi zaroori thi, kyun ke zindagi mein aise aur mauqay aane thay jahan humein apne ehsaas ke saath sabr aur samajhdari ko bhi jagah deni thi.</p>
`
},

{
title: "Khamoshi Ke Baad",
label: "Baab 31 · Sulah",
body: `
<p>Narazgi ke baad hamare darmiyan cheezein hamesha ek hi lamhe mein theek nahi hui thin. Kabhi kabhi dil mein baat reh jaati hai aur insaan ko samajhne mein waqt lagta hai ke ab guftagu kaise shuru ki jaye. Magar hamari kahani mein narazgi hamesha ke liye nahi ruki.</p>

<p>Dheere dheere hamari baat cheet dobara apne mamool ki taraf aane lagi. Jo khamoshi pehle kuch ajeeb mehsoos hoti thi, woh aahista aahista kam hone lagi. Hum phir baat karne lage aur hamare darmiyan woh apnapan dobara nazar aane laga jise hum pehle se jaante thay.</p>

<p>Hamari sulah kisi film ke bade manzar jaisi nahi thi. Na zaroori tha ke koi lambi taqreer hoti, na hi har baat ka ek hi din mein jawab milta. Kabhi rishte chhoti chhoti koshishon se dobara apni raftaar pakarte hain. Ek paighaam, ek aam si baat aur phir guftagu ka dobara chal parna bhi kabhi kabhi bohat maani rakhta hai.</p>

<p>Main yeh samajhne laga tha ke kisi rishte ki khoobsurati is baat mein nahi ke us mein kabhi narazgi na ho. Asal baat yeh hai ke jab ikhtilaf aaye, to dono log ek doosray ko samajhne aur baat ko behtar banane ki koshish karein.</p>

<p>Zahra meri zindagi mein ab bhi wohi shakhs thi jiske saath main apni baatein share karna chahta tha. Uske nicknames, uski hansi, hamari mulaqatein aur hamari guftagu—yeh sab ab bhi meri yaadon aur rozmarrah ka hissa thay.</p>

<p>Is sulah ne mujhe yeh bhi samjhaya ke kisi ke saath apnapan hone ka matlab yeh nahi ke har din ek jaisa guzrega. Kabhi do log ek doosray ko ghalat samajh sakte hain, kabhi koi baat buri lag sakti hai, lekin phir bhi izzat aur samajhdari ke saath baat karne ki gunjaish rehti hai.</p>

<p>Waqt ke saath hamari guftagu dobara chalne lagi aur woh pehli narazgi hamari kahani ka ek waqia ban kar reh gayi. Uska zikr aaj bhi mujhe yaad dilata hai ke mohabbat ke saath seekhna bhi zaroori hai.</p>

<div class="dialogue">Narazgi ek safha thi; hamari poori kahani nahi.</div>

<p>Hum ne phir apne din guzare, baatein ki aur mulaqatein ki. Hamari kahani mein abhi bohat se lamhay aane baqi thay—kuch aise jo humein hansane wale thay, kuch aise jo humein ek doosray ke aur qareeb samajhne ka mauqa dete, aur kuch aise jin ka andaza humein us waqt bilkul nahi tha.</p>
`
},

{
title: "Phir Se Wohi Guftagu",
label: "Baab 32 · Mamool Ki Khushi",
body: `
<p>Jab hamari baat cheet dobara apne mamool par aayi, to mujhe ehsaas hua ke kisi rishte mein chhoti si sulah bhi kitni ahmiyat rakhti hai. Jo paighaam pehle aam lagta tha, woh khamoshi ke baad dobara aaye to uski qeemat mehsoos hoti hai. Jo guftagu pehle roz ka hissa thi, woh dobara shuru ho to dil ko sukoon milta hai.</p>

<p>Hamari zindagi phir apne mamool ke lamhon se bharne lagi. Kabhi Zahra se baat hoti, kabhi main usay kisi nickname se bulata aur kabhi hum apni roz ki baatein share karte. Main uske saath guzre hue waqt ko apni kahani ka hissa samajhta tha aur chahta tha ke hamare darmiyan guftagu aur samajh ka silsila jaari rahe.</p>

<p>Ab mujhe yeh baat pehle se zyada samajh aane lagi thi ke rishte ko sirf ek achhe din ya ek khoobsurat mulaqat se nahi samjha ja sakta. Us mein roz ki chhoti chhoti koshishein bhi shamil hoti hain. Kisi ki baat sunna, apni baat narmi se kehna, ghalat fehmi ko door karna aur ikhtilaf ke waqt bhi izzat qaim rakhna—yeh sab rishte ka hissa hain.</p>

<p>Main Zahra ke saath apne rishte ko samajh raha tha. Har naya din mujhe uske baare mein kuch aur batata aur har guftagu hamare darmiyan ek naya pehlu saamne laati. Kabhi hum kisi khaas baat par baat karte, kabhi koi mamooli sa waqia share karte aur kabhi bas ek doosray ki khairiyat poochna bhi kaafi hota.</p>

<p>Jinnah Park ki mulaqat ab hamari guzri hui yaadon mein shamil ho chuki thi. Us din ke baad bhi hum milay, aur har mulaqat apni jagah ek nayi yaad banati gayi. Main us din ko apni kahani ka ek khaas safha samajhta hoon, lekin hamari poori kahani sirf us ek din tak mehdood nahi thi.</p>

<p>Us waqt main yeh nahi jaanta tha ke aage chal kar hamare saamne kitne mushkil faislay aayenge. Filhaal hamari kahani mein guftagu dobara chal rahi thi aur hum apne apne andaaz mein ek doosray ko samajhne ki koshish kar rahe thay.</p>

<p>Yeh woh daur tha jab chhoti chhoti khushiyan hamare dinon ko apna rang deti thin. Ek nickname, ek mazaahiya jumla, ek mulaqat ya kisi baat ka jawab—yeh sab mil kar hamare rishte ki yaadon ko bharte ja rahe thay.</p>

<p>Har kahani mein aise safhay hone chahiye jinhein parh kar insaan ko yaad aaye ke kabhi zindagi kitni saada aur khushgawar bhi thi. Hamari kahani ke yeh safhay bhi unhi dinon ki yaad hain.</p>

<div class="dialogue">Hum ne narazgi ke baad dobara baat karna seekha, aur kahani apne aglay safhay ki taraf barh gayi.</div>
`
}

,
{
title: "Baarish, Chai Aur Meri Zahra",
label: "Baab 33 · Ek Yaadgar Din",
body: `
<p>Kuch din insaan ki zindagi mein bilkul aam tareeqe se shuru hote hain, lekin khatam hote hote woh uski sab se pyari yaadon mein shamil ho jaate hain. Us din bhi main Zahra se milne gaya tha. Mujhe nahi pata tha ke us mulaqat mein mausam hamare liye ek aisa manzar banane wala hai jise main baad mein itni baar yaad karunga.</p>

<p>Main us se milne ke liye nikla to mere zehan mein bas yahi tha ke aaj kuch waqt uske saath guzarna hai. Us se baat karni hai, uski baatein sunni hain aur uske saath kuch aise lamhe jeene hain jo hamari kahani ka hissa ban sakein. Mujhe kya maloom tha ke aasman ke badalte hue rang hamare din ka rukh hi badal denge.</p>

<p>Pehle halki halki boondein girne lagin. Aasman par badal chhaye hue thay aur hawa mein thandak si mehsoos ho rahi thi. Phir baarish ne achanak apni raftaar barha di. Dekhte hi dekhte hum dono bheeg gaye. Baalon par paani ki boondein thehr gayin, kapray geelay ho gaye aur aas paas ka manzar baarish ki wajah se badal gaya.</p>

<p>Main ne Zahra ki taraf dekha. Us waqt mere liye sab se zaroori baat yeh thi ke woh theek rahe aur usay thand na lag jaye. Baarish apni jagah khoobsurat thi, lekin geelay kapron mein zyada der rehna munasib nahi tha. Main ne socha ke usay ghar le jaata hoon, taake woh araam se kapray badal sake aur hum dono mausam ki is achanak tabdeeli se bach sakein.</p>

<p>Yun hamari mulaqat ka agla hissa mere ghar par guzarna tha. Yeh koi pehle se banaya hua plan nahi tha. Bas mausam ne achanak aisa mor liya aur humein apne din ko usi hisaab se guzarna pada. Kabhi kabhi zindagi ke sab se yaadgar manzar kisi plan ke baghair hi saamne aa jaate hain.</p>

<p>Ghar aane ke baad main ne apni behan ke kapray Zahra ko diye, taake woh geelay kapray badal kar araam kar sake. Main chahta tha ke usay kisi qisam ki pareshani mehsoos na ho. Uske liye yeh jagah aur yeh surat-e-haal shayad achanak thi, is liye main ne koshish ki ke har cheez saadgi aur ehtiyaat se ho.</p>

<p>Jab tak woh kapray badal rahi thi, main ne socha ke uske liye kuch garam banaya jaye. Baarish ki thandak mein chai ka khayal aaya, magar phir mujhe mehsoos hua ke sirf chai hi kyun? Main uske liye kuch khane ko bhi bana sakta tha. Aakhir woh mere ghar aayi thi aur main chahta tha ke usay mehmaan hone ka ehsaas nahi, balkay apnapan mehsoos ho.</p>

<p>Main kitchen mein gaya aur uske liye chai banane laga. Bahar baarish ab bhi ho rahi thi. Khirki se aati hui thandi hawa aur baarish ki awaaz ke darmiyan kitchen ka mahaul apni jagah sukoon bhara tha. Main chai tayyar kar raha tha aur zehan mein yahi tha ke Zahra ko garam chai doon, taake usay thandak se araam mile.</p>

<p>Chai ke saath main ne uske liye kuch khane ka bhi intezam kiya. Mere liye us din ka sab se khaas hissa koi bari baat nahi thi. Mujhe achha lag raha tha ke main uske liye kuch kar raha hoon. Kabhi kabhi apnapan lafzon se zyada chhote chhote kaamon mein nazar aata hai.</p>

<div class="dialogue">“Baarish ne to aaj hamara poora plan hi badal diya,” main ne muskurate hue kaha.</div>

<p>Us din ki baarish hamari mulaqat mein ek aisa mor le aayi thi jiska hum ne pehle se socha nahi tha. Magar ab hum ek aisi jagah par thay jahan araam se baith kar chai pee sakte thay aur apni baatein jaari rakh sakte thay.</p>

<p>Main ne chai uske saamne rakhi. Garam chai se uthti hui bhaap, khirki ke bahar baarish aur andar ka sukoon—yeh sab mil kar us lamhe ko yaadgar bana rahe thay. Main uske paas baith gaya aur hum baat karne lage.</p>

<p>Us waqt mujhe mehsoos hua ke mulaqat ko khoobsurat banane ke liye hamesha kisi khaas jagah ki zaroorat nahi hoti. Kabhi ek chhota sa kamra, do cup chai aur saamne baitha hua woh shakhs jise aap pasand karte hain, din ko yaadgar banane ke liye kaafi hota hai.</p>

<p>Baarish bahar barasti rahi aur hamari guftagu andar chalti rahi. Us din ka yeh saada sa manzar meri yaadon mein is liye reh gaya kyun ke is mein hamari zindagi ka apna pan tha. Na koi khaas tayyari, na koi banawat—bas ek achanak badla hua plan aur uske darmiyan saath guzarta hua waqt.</p>
`
},

{
title: "Ek Cup Chai Aur Do Dil",
label: "Baab 34 · Ghar Ka Sukoon",
body: `
<p>Chai tayyar thi aur baarish ab bhi khirki ke bahar apni dhun mein baras rahi thi. Main Zahra ke paas baitha tha. Hum dono ke paas baat karne ke liye bohat kuch tha, lekin us lamhe ki khoobsurati sirf alfaaz mein nahi thi. Bahar baarish ki awaaz thi, andar garam chai thi aur hamare darmiyan woh apnapan tha jo waqt ke saath paida hua tha.</p>

<p>Main ne us se poocha ke chai theek bani hai ya nahi. Mere liye yeh ek mamooli sa sawal tha, lekin us din mujhe uske jawab ka intezar kuch khaas laga. Main chahta tha ke usay chai pasand aaye aur woh araam se baithe. Jab hum kisi ke liye kuch karte hain, to dil chahta hai ke usay woh cheez achhi lage. Shayad isi liye uske liye banayi hui chai bhi mujhe aam chai se mukhtalif mehsoos ho rahi thi.</p>

<p>Hum baat karte rahe. Kabhi main koi baat kehta, kabhi woh apni taraf se kuch batati. Baarish ki awaaz hamari guftagu ke darmiyan aati rehti, magar us se mahaul aur bhi pur-sukoon lag raha tha. Main us din ko kisi filmi manzar mein badalna nahi chahta tha. Mere liye uski asal khoobsurati yahi thi ke hum apne mamool ke andaaz mein saath baithe thay.</p>

<p>Thori der baad hum ne apni baatein jaari rakhte hue ek doosray ke aur qareeb baithna shuru kiya. Main ne uska haath apne haath mein liya. Yeh ek saada sa, narm sa lamha tha. Main ne uski taraf dekha aur uske haath ko aahista se thaam kar baitha raha.</p>

<p>Kabhi kabhi haath pakarne ka matlab kisi bari baat ka izhaar nahi hota. Woh bas ek nishani hoti hai ke is waqt aap kisi ke saath hain aur uski mojoodgi aapke liye ahmiyat rakhti hai. Mere liye bhi woh lamha isi apnapan ka hissa tha.</p>

<p>Uske haath ki narmi aur bahar baarish ki awaaz ke darmiyan waqt kuch dheema sa mehsoos ho raha tha. Hum baatein karte rahe. Kabhi main uski taraf dekh kar muskurata aur kabhi woh meri baat par apna reaction deti. Mujhe us lamhe mein kisi bari cheez ki zaroorat nahi thi. Main bas chahta tha ke woh araam se baithe aur hum apna waqt sukoon se guzarein.</p>

<p>Chai ke cup dheere dheere khaali hote gaye, lekin hamari guftagu chalti rahi. Us din mujhe ek baar phir ehsaas hua ke kisi ko chahne ka matlab sirf usay apne ehsaas batana nahi. Kabhi uske liye chai banana, uski sahulat ka khayal rakhna aur uske saath araam se waqt guzarna bhi mohabbat ke izhaar ka ek tareeqa hota hai.</p>

<div class="dialogue">Bahar baarish thi, saamne Zahra thi, aur mere haath mein uska haath. Us lamhe mein mujhe kisi aur cheez ki zaroorat mehsoos nahi ho rahi thi.</div>

<p>Us din ki yaad mere liye is liye qeemti hai kyun ke us mein khushi kisi bari baat se nahi aayi thi. Woh khushi chhote chhote lamhon mein thi—garam chai, aahista chalti guftagu, haath pakarne ka sukoon aur baarish ki awaaz.</p>
`

{
title: "Meri God Mein Uska Sar",
label: "Baab 35 · Narmi Ka Lamha",
body: `
<p>Baarish ka mahaul ab bhi qaim tha aur hamari guftagu ke darmiyan ek sukoon sa aa gaya tha. Kuch der baad Zahra ne apna sar meri god mein rakh diya. Woh lamha mere liye bohat narm aur qeemti tha. Uski is qurbat mein mujhe apnapan mehsoos hua—aisa apnapan jo kisi bari baat ya kisi khaas izhaar ka mohtaaj nahi hota.</p>

<p>Main ne uski taraf dekha. Woh araam se leti hui thi aur main uske baalon mein aahista aahista haath pherne laga. Main nahi chahta tha ke uske araam mein khalal aaye. Us waqt mere liye sab se aham baat yahi thi ke woh sukoon se rahe aur usay mere paas mehfooz aur mutmain mehsoos ho.</p>

<p>Uske baalon mein haath pherte hue mujhe ehsaas hua ke kisi ka khayal rakhna kabhi kabhi bohat saada hota hai. Na kisi khaas jumlay ki zaroorat, na kisi bari harkat ki. Bas kisi ke paas baithna, uski sahulat ka khayal rakhna aur usay apni mojoodgi se sukoon dena bhi apne aap mein ek khoobsurat baat hai.</p>

<p>Main uske baalon mein aahista se haath pherta raha. Kabhi meri ungliyan uske baalon ko sanwartin aur kabhi main bas apna haath uske sar par rakh kar baitha rehta. Bahar baarish ki awaaz thi aur andar waqt apni raftaar se guzar raha tha. Mere liye woh lamha kisi tasveer ki tarah tha—saada, pur-sukoon aur hamari kahani se juda hua.</p>

<p>Us waqt mujhe kisi aur baat ko sabit karne ki zaroorat nahi thi. Main usay apne qareeb mehsoos kar raha tha aur woh mere paas araam se thi. Kabhi kabhi insaan kisi rishte ki gehrai ko us waqt samajhta hai jab dono log khamoshi mein bhi ek doosray ke saath mutmain hon.</p>

<p>Main ne uske baalon mein haath pherna jaari rakha. Agar woh kuch kehti, to main uski baat sunta; agar woh khamosh rehti, to main us khamoshi ko bhi jagah deta. Har lamhe ko alfaaz se bhar dena zaroori nahi hota. Kuch lamhay bas mehsoos karne ke liye hote hain.</p>

<p>Uski god mein sar rakhne ki yaad aur mera uske baalon mein haath pherna mere liye sirf qurbat ka manzar nahi tha. Yeh bharose aur sukoon ka ek lamha tha. Main chahta tha ke woh mere saath apni marzi se rahe, apni sahulat ke mutabiq baithe aur jo mehsoos kare, woh bina jhijhak keh sake.</p>

<p>Mohabbat mein qurbat tabhi khoobsurat lagti hai jab uske saath ehtram bhi ho. Kisi ka haath thaamna, uske paas baithna ya usay araam karne dena tabhi achha lagta hai jab dono log is qurbat mein khush aur mutmain hon.</p>

<div class="dialogue">Woh meri god mein sar rakhe araam kar rahi thi, aur main uske baalon mein haath pherte hue soch raha tha ke kuch lamhay waqai dil mein ghar kar jaate hain.</div>

<p>Us din ki yaad mein mujhe koi bari baat yaad nahi aati. Mujhe bas woh narmi yaad aati hai, uska mere paas araam se rehna aur mera uska khayal rakhna. Shayad isi liye yeh manzar meri kahani ke sab se pur-sukoon lamhon mein se ek hai.</p>
`

<p>Har baarish ruk jaati hai. Badal dheere dheere chhat jaate hain, boondein kam hone lagti hain aur mausam apni pehli si surat mein wapas aane lagta hai. Magar kuch baarishein insaan ki yaadon mein reh jaati hain. Mere liye woh din bhi aisa hi tha.</p>

<p>Jab main us din ko yaad karta hoon, to mere zehan mein sab se pehle baarish ka achanak shuru hona aata hai. Phir woh manzar yaad aata hai jab hum dono geelay ho gaye thay aur main Zahra ko ghar le aaya tha. Mujhe apni behan ke kapray dena, uske liye chai banana aur phir uske saath baith kar baatein karna yaad aata hai.</p>

<p>Us din ne mujhe yeh yaad dilaya ke kisi ke liye kuch karna hamesha kisi bade tohfay ya bari tayyari ka naam nahi hota. Kabhi uske liye chai banana, usay araam dena aur uske saath waqt guzarna bhi bohat maani rakhta hai.</p>

<p>Hamari kahani mein baarish ka yeh waqia ek alag rang lekar aaya. Jinnah Park ki mulaqat apni jagah yaadgar thi, lekin yeh din ghar ke sukoon, garam chai aur ek doosray ka khayal rakhne se juda hua tha.</p>

<p>Main nahi jaanta tha ke aage chal kar zindagi humein kis taraf le jayegi. Us waqt main sirf us waqt ko yaad rakhna chahta tha jo hamare paas tha. Zahra ke saath guzare hue din, hamari guftagu aur woh chhote chhote lamhay jin mein hamara rishta apni kahani likh raha tha.</p>

<div class="dialogue">Baarish ruk gayi thi, magar us din ki yaad mere andar ek aise safhe par mehfooz ho gayi jise waqt bhi mita nahi saka.</div>

<p>Yeh hamari kahani ka ek aur safha tha—ek aisa safha jahan mohabbat ka izhaar sirf alfaaz se nahi, balkay chai banane, haath thaamne aur kisi ko sukoon se araam karne dene se bhi hua.</p>

{
title: "Uske Saath Guzarte Din",

body: `
<p>Baarish wale din ki yaad mere zehan mein mehfooz thi, lekin hamari kahani sirf us ek din tak mehdood nahi thi. Us din ke baad bhi zindagi apni raftaar se chalti rahi. Hum milte rahe, baatein karte rahe aur ek doosray ki zindagi ke chhote chhote hisson se waqif hote rahe. Har mulaqat apne saath ek naya waqia laati aur har guftagu mein koi na koi aisi baat hoti jo baad mein yaad ban sakti thi.</p>

<p>Mujhe Zahra ke saath waqt guzarna achha lagta tha. Kabhi hum kisi khaas baat par guftagu karte, kabhi rozmarrah ke mamool ka zikr hota aur kabhi kisi chhoti si baat par hans dete. Mujhe yeh ehsaas hone laga tha ke kisi shakhs ko apna samajhne ka matlab sirf uske saath achhe lamhay guzarna nahi, balkay uski aadaton ko samajhna aur uski baaton ko ahmiyat dena bhi hai.</p>

<p>Zahra kabhi bohat baatein karti aur kabhi khamosh ho jaati. Main uske dono andaaz ko samajhne ki koshish karta. Har khamoshi ka matlab narazgi nahi hota aur har muskurahat ke peeche zaroori nahi ke insaan bilkul pareshan na ho. Main chahta tha ke woh apni marzi se mujh se baat kare aur agar kabhi usay khamosh rehna ho, to woh bhi uske liye bilkul theek ho.</p>

<p>Hamare darmiyan kuch aise alfaaz aur nicknames thay jo aam guftagu ko bhi khaas bana dete. Main kabhi usay “Meri Mah Girlee” kehta, kabhi “Meri Tamatar Girlee” aur kabhi “Meri Choti Si Guriya”. Yeh naam hamare darmiyan apnapan aur shararat ka hissa ban chuke thay.</p>

<p>Kabhi main kisi baat ke darmiyan achanak usay “Meri Golu Molu Tamatar” keh deta aur phir guftagu ka rukh hi badal jata. Mujhe uska reaction dekhna achha lagta tha. Aise lamhay chhote thay, magar inhi se hamari apni ek duniya banti ja rahi thi.</p>

<p>Waqt ke saath main samajhne laga tha ke rishte ki khoobsurati sirf un lamhon mein nahi hoti jinhein hum pehle se khaas samajh kar jeete hain. Kabhi kisi aam din ka ek chhota sa jumla bhi dil mein reh jata hai. Kabhi kisi mulaqat ka koi saada sa manzar yaad rehta hai, aur kabhi kisi ka bulane ka andaaz saalon baad bhi zehan mein goonjta hai.</p>

<p>Us waqt mujhe yeh nahi pata tha ke ek din main inhi chhoti chhoti baaton ko jor kar apni kahani likhunga. Main to bas Zahra ke saath apna waqt guzar raha tha. Mujhe lagta tha ke hamare paas baat karne ke liye aur bhi bohat se din honge aur hum apni kahani ke mazeed safhay likhte rahenge.</p>

<div class="dialogue">Kuch log zindagi mein sirf khaas mauqon par yaad nahi aate; woh roz ke mamool ka hissa ban kar har chhoti baat mein yaad aate hain.</div>

<p>Yahi woh daur tha jab Zahra ki mojoodgi meri zindagi ke mamool mein shamil hoti ja rahi thi. Uski baatein, uske nicknames aur hamari mulaqatein mere liye alag alag waqiat nahi rahe thay. Yeh sab mil kar hamari kahani ka ek musalsal hissa ban gaye thay.</p>
`
},
